<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Recursio | Karakter</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #3f6672; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .tag { position: absolute; transform: translate(-50%, 0); color: #fff4d8; font-size: 13px; font-weight: 600;
         background: rgba(20, 14, 34, 0.7); padding: 3px 10px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #bar { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 8px; justify-content: center; }
  button { font: inherit; font-size: 14px; padding: 10px 16px; border: 0; border-radius: 6px; background: #f4cf5a; color: #3a2a14; font-weight: 600; }
  button.off { background: #4a4066; color: #d8d0ee; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"><button id="walk">Jalan</button><button id="spin">Putar</button></div>
<script type="module">
import * as THREE from "./lib/three.module.min.js";
import { buildChar, CHAR_KEYS, charName } from "./chars3d.js";

const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#3f6672");
scene.fog = new THREE.Fog("#3f6672", 13, 26);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 60);

scene.add(new THREE.HemisphereLight("#e8f2ff", "#5a6a66", 1.7));
const key = new THREE.DirectionalLight("#fff0dc", 2.4);
key.position.set(-3, 6, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -4, right: 4, top: 5, bottom: -3, near: 0.5, far: 20 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight("#8aa0ff", 1.2); rim.position.set(3, 3, -4); scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: "#3d6570", roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// empat karakter di alas bundar, susunan 2 x 2 agar pas di layar HP tegak
const SPOTS = [[-0.8, 1.6], [0.8, 1.6], [-0.8, -1.9], [0.8, -1.9]];
const actors = CHAR_KEYS.map((k, i) => {
  const a = buildChar(k);
  a.root.position.set(SPOTS[i][0], 0.08, SPOTS[i][1]);
  scene.add(a.root);
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.64, 0.08, 40), new THREE.MeshStandardMaterial({ color: "#4a7884", roughness: 0.9 }));
  plinth.position.set(SPOTS[i][0], 0.04, SPOTS[i][1]); plinth.receiveShadow = true; plinth.castShadow = true; scene.add(plinth);
  const tag = document.createElement("div"); tag.className = "tag"; tag.textContent = charName(k); document.body.appendChild(tag);
  return { ...a, tag };
});

const state = { walk: false, spin: true, yaw: 0 };
const bWalk = document.getElementById("walk"), bSpin = document.getElementById("spin");
const sync = () => { bWalk.className = state.walk ? "" : "off"; bSpin.className = state.spin ? "" : "off"; };
bWalk.onclick = () => { state.walk = !state.walk; sync(); };
bSpin.onclick = () => { state.spin = !state.spin; sync(); };
sync();

function fit() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", fit); fit();

const view = { pos: [0, 5.6, 12.4], look: [0, 0.85, -0.2] };
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.spin) state.yaw += dt * 0.7;
  camera.position.set(...view.pos); camera.lookAt(...view.look);
  for (const a of actors) {
    a.root.rotation.y = state.yaw;
    a.update(dt, state.walk ? dt * 2.2 : 0, state.walk);
    const p = a.root.position.clone(); p.y = -0.02; p.project(camera);
    a.tag.style.left = (p.x * 0.5 + 0.5) * innerWidth + "px";
    a.tag.style.top = (-p.y * 0.5 + 0.5) * innerHeight + 4 + "px";
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__show = { state, view, actors, sync };   // dipakai untuk mengambil gambar
</script>
</body>
</html>
