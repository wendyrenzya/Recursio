<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Recursio | Karakter</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #ece8e2; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .tag { position: absolute; transform: translate(-50%, 0); color: #fff4d8; font-size: 13px; font-weight: 600;
         background: rgba(20, 14, 34, 0.7); padding: 3px 10px; border-radius: 4px; pointer-events: none; white-space: nowrap; }
  #bar { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 0 8px; }
  button { font: inherit; font-size: 13px; padding: 9px 12px; border: 0; border-radius: 6px; background: #f4cf5a; color: #3a2a14; font-weight: 600; }
  button.off { background: #4a4066; color: #d8d0ee; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bar"><span id="who"></span><button id="walk">Jalan</button><button id="spin">Putar</button></div>
<script type="module">
import * as THREE from "./lib/three.module.min.js";
import { loadChar, CHAR_KEYS, charName } from "./chars3d.js";

const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#ece8e2");
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 60);

scene.add(new THREE.HemisphereLight("#ffffff", "#cfc4c8", 1.9));
const key = new THREE.DirectionalLight("#fff4e6", 1.5);
key.position.set(-2.5, 5, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 3, bottom: -1, near: 0.5, far: 20 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02; key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight("#dfe6ff", 0.9); rim.position.set(3, 3, -4); scene.add(rim);

const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// satu karakter tampil besar setinggi mata, dipilih lewat tombol nama
const actors = await Promise.all(CHAR_KEYS.map(loadChar));
for (const a of actors) scene.add(a.root);
const state = { walk: false, spin: true, yaw: 0.35, cur: 0 };
const bWalk = document.getElementById("walk"), bSpin = document.getElementById("spin"), who = document.getElementById("who");
who.style.display = "contents";
const bWho = CHAR_KEYS.map((k, i) => { const b = document.createElement("button"); b.textContent = charName(k); b.onclick = () => { state.cur = i; sync(); }; who.appendChild(b); return b; });
const sync = () => {
  bWalk.className = state.walk ? "" : "off"; bSpin.className = state.spin ? "" : "off";
  bWho.forEach((b, i) => { b.className = i === state.cur ? "" : "off"; });
  actors.forEach((a, i) => { a.root.visible = i === state.cur; });
};
bWalk.onclick = () => { state.walk = !state.walk; sync(); };
bSpin.onclick = () => { state.spin = !state.spin; sync(); };
sync();

function fit() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", fit); fit();

const view = { pos: [0, 1.0, 5.6], look: [0, 0.8, 0] };
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state.spin) state.yaw += dt * 0.7;
  camera.position.set(...view.pos); camera.lookAt(...view.look);
  for (const a of actors) { a.root.rotation.y = state.yaw; a.update(dt, state.walk ? dt * 2.2 : 0, state.walk); }
  renderer.render(scene, camera);
  window.__calls = renderer.info.render.calls;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__show = { state, view, actors, sync };   // dipakai untuk mengambil gambar
</script>
</body>
</html>
