<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Recursio</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #1a1424; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="180" height="320"></canvas>
<script>
"use strict";

// ================================================================ dasar
// Resolusi internal 180 x 320, tile 16 px, kecepatan jalan 4 tile per detik
const VW = 180, VH = 320, TS = 16, SPEED = 64;
const GRASS = 0, ROAD = 1, HOUSE = 2, TREE = 3, WATER = 4, FOREST = 5, PALM = 6, LAMP = 7, FIELD = 8;   // tipe > 1 menghalangi jalan

const hash = (x, y, s = 0) => {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1274126177)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const P = (c, col, x, y) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
const R = (c, col, x, y, w, h) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

// ================================================================ mesin sprite berbasis bentuk
// Bentuk (elips, poligon, persegi bulat) digambar ke mask lalu diisi warna rata, jadi piksel tetap tajam.
// Shading sabit: tepi kiri atas diberi warna terang, tepi kanan bawah warna gelap.
// Outline selektif: piksel kosong di tepi diberi versi gelap dari warna tetangganya.
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const toHex = (r, g, b) => "#" + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
const dark = (h, k = 0.5) => { const [r, g, b] = hex(h); return toHex(r * k + 18, g * k + 6, b * k + 34); };

class Pix {
  constructor(w, h) { this.w = w; this.h = h; this.col = new Array(w * h).fill(null); }
  mask(fn) {
    const cv = mk(this.w, this.h), c = cv.getContext("2d");
    c.fillStyle = "#fff"; c.strokeStyle = "#fff";
    fn(c);
    const d = c.getImageData(0, 0, this.w, this.h).data, m = new Uint8Array(this.w * this.h);
    for (let i = 0; i < m.length; i++) m[i] = d[i * 4 + 3] >= 128 ? 1 : 0;
    return m;
  }
  shift(m, dx, dy) {
    const o = new Uint8Array(m.length);
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const sx = x - dx, sy = y - dy;
      if (sx >= 0 && sy >= 0 && sx < this.w && sy < this.h) o[y * this.w + x] = m[sy * this.w + sx];
    }
    return o;
  }
  paint(color, m) { for (let i = 0; i < m.length; i++) if (m[i]) this.col[i] = color; }
  // ramp: [dasar, terang, gelap]; k: tebal sabit
  shape(ramp, fn, k = 1) {
    const m = this.mask(fn);
    this.paint(ramp[0], m);
    if (ramp[1]) { const s = this.shift(m, k, k); this.paint(ramp[1], m.map((v, i) => v && !s[i])); }
    if (ramp[2]) { const s = this.shift(m, -k, -k); this.paint(ramp[2], m.map((v, i) => v && !s[i])); }
    return m;
  }
  dot(color, x, y) { if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.col[y * this.w + x] = color; }
  rect(color, x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.dot(color, i, j); }
  outline() {
    const { w, h } = this, src = this.col.slice();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (src[y * w + x]) continue;
      for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const n = src[ny * w + nx];
        if (n) { this.col[y * w + x] = dark(n, 0.38); break; }
      }
    }
  }
  canvas() {
    const cv = mk(this.w, this.h), c = cv.getContext("2d");
    this.col.forEach((v, i) => { if (v) P(c, v, i % this.w, (i / this.w) | 0); });
    return cv;
  }
}
// pembantu bentuk untuk fungsi mask
const ell = (cx, cy, rx, ry, rot = 0) => (c) => { c.beginPath(); c.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); c.fill(); };
const poly = (pts) => (c) => { c.beginPath(); pts.forEach(([x, y], i) => (i ? c.lineTo(x, y) : c.moveTo(x, y))); c.closePath(); c.fill(); };
const rrect = (x, y, w, h, r) => (c) => { c.beginPath(); c.roundRect(x, y, w, h, r); c.fill(); };
const all = (...fns) => (c) => fns.forEach((f) => f(c));
const clip = (x, y, w, h, fn) => (c) => { c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip(); fn(c); c.restore(); };

// ================================================================ palet cerah
const C = {
  g0: "#2f7a32", g1: "#4a9a34", g2: "#6cbd3c", g3: "#8ed24e", g4: "#b6e66c", g5: "#dff59a",
  d0: "#8a5a32", d1: "#b07a44", d2: "#cf9a5a", d3: "#e2b674", d4: "#f2d49a",
  w0: "#2a6cc0", w1: "#3e8ee0", w2: "#5cacf0", w3: "#9ad4fa", w4: "#e8f8ff",
  s1: "#ead29a", s2: "#f6e6b6",
  wood0: "#6e4228", wood1: "#93603a", wood2: "#b8814c", wood3: "#d8a66a",
  wall0: "#d8b884", wall1: "#efd6a4", wall2: "#fbecc6",
  red0: "#a83a32", red1: "#d65a42", red2: "#f08a5e",
  blue0: "#3a5a9a", blue1: "#5a82c8", blue2: "#8ab0e8",
  soil0: "#7a4e2e", soil1: "#9a6a3e", soil2: "#b8864e",
};

// ================================================================ font bitmap 5x7
// Tiap karakter 7 baris (9 untuk huruf berekor g j p q y), 5 bit per baris.
const FONT_SRC = {
  " ": "00 00 00 00 00 00 00",
  "A": "0E 11 11 1F 11 11 11", "B": "1E 11 11 1E 11 11 1E", "C": "0E 11 10 10 10 11 0E",
  "D": "1E 11 11 11 11 11 1E", "E": "1F 10 10 1E 10 10 1F", "F": "1F 10 10 1E 10 10 10",
  "G": "0E 11 10 17 11 11 0F", "H": "11 11 11 1F 11 11 11", "I": "0E 04 04 04 04 04 0E",
  "J": "07 02 02 02 02 12 0C", "K": "11 12 14 18 14 12 11", "L": "10 10 10 10 10 10 1F",
  "M": "11 1B 15 15 11 11 11", "N": "11 11 19 15 13 11 11", "O": "0E 11 11 11 11 11 0E",
  "P": "1E 11 11 1E 10 10 10", "Q": "0E 11 11 11 15 12 0D", "R": "1E 11 11 1E 14 12 11",
  "S": "0F 10 10 0E 01 01 1E", "T": "1F 04 04 04 04 04 04", "U": "11 11 11 11 11 11 0E",
  "V": "11 11 11 11 11 0A 04", "W": "11 11 11 15 15 15 0A", "X": "11 11 0A 04 0A 11 11",
  "Y": "11 11 11 0A 04 04 04", "Z": "1F 01 02 04 08 10 1F",
  "a": "00 00 0E 01 0F 11 0F", "b": "10 10 16 19 11 11 1E", "c": "00 00 0E 10 10 11 0E",
  "d": "01 01 0D 13 11 11 0F", "e": "00 00 0E 11 1F 10 0E", "f": "06 09 08 1C 08 08 08",
  "g": "00 00 0F 11 11 11 0F 01 0E", "h": "10 10 16 19 11 11 11", "i": "04 00 0C 04 04 04 0E",
  "j": "02 00 06 02 02 02 02 12 0C", "k": "10 10 12 14 18 14 12", "l": "0C 04 04 04 04 04 0E",
  "m": "00 00 1A 15 15 11 11", "n": "00 00 16 19 11 11 11", "o": "00 00 0E 11 11 11 0E",
  "p": "00 00 1E 11 11 11 1E 10 10", "q": "00 00 0F 11 11 11 0F 01 01", "r": "00 00 16 19 10 10 10",
  "s": "00 00 0E 10 0E 01 1E", "t": "08 08 1C 08 08 09 06", "u": "00 00 11 11 11 13 0D",
  "v": "00 00 11 11 11 0A 04", "w": "00 00 11 11 15 15 0A", "x": "00 00 11 0A 04 0A 11",
  "y": "00 00 11 11 11 11 0F 01 0E", "z": "00 00 1F 02 04 08 1F",
  "0": "0E 11 13 15 19 11 0E", "1": "04 0C 04 04 04 04 0E", "2": "0E 11 01 02 04 08 1F",
  "3": "1F 02 04 02 01 11 0E", "4": "02 06 0A 12 1F 02 02", "5": "1F 10 1E 01 01 11 0E",
  "6": "06 08 10 1E 11 11 0E", "7": "1F 01 02 04 08 08 08", "8": "0E 11 11 0E 11 11 0E",
  "9": "0E 11 11 0F 01 02 0C",
  ".": "00 00 00 00 00 0C 0C", ",": "00 00 00 00 0C 04 08", "!": "04 04 04 04 04 00 04",
  "?": "0E 11 01 02 04 00 04", ":": "00 0C 0C 00 0C 0C 00", "'": "0C 04 08 00 00 00 00",
  "-": "00 00 00 1F 00 00 00", "(": "02 04 08 08 08 04 02", ")": "08 04 02 02 02 04 08",
};
const FONT = {};
for (const [ch, src] of Object.entries(FONT_SRC)) {
  const rows = src.split(" ").map((h) => parseInt(h, 16));
  let w = 0;
  for (const r of rows) for (let b = 0; b < 5; b++) if (r & (16 >> b)) w = Math.max(w, b + 1);
  FONT[ch] = { rows, w: ch === " " ? 3 : w };
}
const textW = (s) => [...s].reduce((a, ch) => a + (FONT[ch] || FONT["?"]).w + 1, 0) - 1;
function drawText(c, s, x, y, col, shadow) {
  let cx = x;
  for (const ch of s) {
    const g = FONT[ch] || FONT["?"];
    g.rows.forEach((r, j) => {
      for (let b = 0; b < g.w; b++) if (r & (16 >> b)) {
        if (shadow) P(c, shadow, cx + b + 1, y + j + 1);
        P(c, col, cx + b, y + j);
      }
    });
    cx += g.w + 1;
  }
}

// ================================================================ peta
const MW = 20, MH = 32;
const map = Array.from({ length: MH }, () => new Array(MW).fill(GRASS));
const fill = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j][i] = t; };
fill(0, 0, MW, 1, FOREST); fill(0, MH - 1, MW, 1, FOREST);   // pepohonan di pinggir peta
fill(0, 0, 1, MH, FOREST); fill(MW - 1, 0, 1, MH, FOREST);
fill(9, 1, 2, MH - 2, ROAD);                                  // jalan utama
fill(1, 20, 18, 2, ROAD);                                     // jalan melintang
fill(3, 4, 4, 3, HOUSE);  fill(4, 7, 6, 1, ROAD);             // rumah Nino dan jalannya
fill(13, 4, 4, 3, HOUSE); fill(10, 7, 6, 1, ROAD);            // rumah Kael dan jalannya
fill(13, 24, 5, 4, WATER);                                    // kolam
fill(3, 10, 4, 2, FIELD);                                     // kebun sayur Ibu Nino
const put = (t, pts) => pts.forEach(([x, y]) => { map[y][x] = t; });
put(TREE, [[2, 13], [3, 15], [15, 12], [17, 14], [16, 17], [2, 17], [6, 28], [17, 19]]);
put(PALM, [[7, 11], [13, 11], [1, 24], [4, 25], [12, 29], [18, 23], [7, 16], [14, 17], [2, 28]]);
put(LAMP, [[8, 6], [11, 19], [8, 22]]);
const tileAt = (x, y) => (x >= 0 && y >= 0 && x < MW && y < MH ? map[y][x] : FOREST);

const baseWalkable = (x, y) =>
  x >= 0 && y >= 0 && x < MW && y < MH && (map[y][x] === GRASS || map[y][x] === ROAD);

// ================================================================ tile tanah (digambar sekali)
const isRoadLike = (x, y) => { const t = tileAt(x, y); return t === ROAD || t === HOUSE; };
const isWater = (x, y) => tileAt(x, y) === WATER;

function drawGrass(c, ox, oy, tx, ty) {
  R(c, C.g2, ox, oy, TS, TS);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {     // bercak lembut 2 x 2
    const h = hash((tx * TS + x) >> 1, (ty * TS + y) >> 1, 1) % 100;
    if (h < 7) P(c, C.g3, ox + x, oy + y); else if (h < 11) P(c, C.g1, ox + x, oy + y);
  }
  for (let k = 0; k < 3; k++) {                       // helai rumput bentuk V
    const h = hash(tx, ty, 10 + k);
    if (h % 4 === 0) continue;
    const x = 2 + ((h >>> 4) % 12), y = 3 + ((h >>> 9) % 11);
    P(c, C.g1, ox + x, oy + y + 1);
    P(c, C.g4, ox + x - 1, oy + y); P(c, C.g4, ox + x + 1, oy + y); P(c, C.g3, ox + x, oy + y);
    P(c, C.g4, ox + x - 2, oy + y - 1); P(c, C.g4, ox + x + 2, oy + y - 1);
  }
  const f = hash(tx, ty, 20) % 9;                     // bunga kecil
  if (f < 2) {
    const cols = [["#ffffff", "#f8d040"], ["#ff9ab8", "#fff0a0"], ["#ffe050", "#f08a30"], ["#a8c8ff", "#ffffff"]][hash(tx, ty, 21) % 4];
    for (let k = 0; k < 3; k++) {
      const x = 3 + (hash(tx, ty, 22 + k) % 10), y = 3 + (hash(tx, ty, 25 + k) % 10);
      P(c, C.g0, ox + x, oy + y + 2);
      P(c, cols[0], ox + x - 1, oy + y); P(c, cols[0], ox + x + 1, oy + y);
      P(c, cols[0], ox + x, oy + y - 1); P(c, cols[0], ox + x, oy + y + 1); P(c, cols[1], ox + x, oy + y);
    }
  }
}

function drawRoad(c, ox, oy, tx, ty) {
  const open = [!isRoadLike(tx, ty - 1), !isRoadLike(tx, ty + 1), !isRoadLike(tx - 1, ty), !isRoadLike(tx + 1, ty)];
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const wx = tx * TS + x, wy = ty * TS + y;
    const h = hash(wx >> 1, wy >> 1, 3) % 100;
    let col = h < 10 ? C.d3 : h < 16 ? C.d1 : C.d2;
    let d = 99, ew = 0;                               // tepi bergelombang ke rumput
    if (open[0] && y < d) { d = y; ew = wx; }
    if (open[1] && 15 - y < d) { d = 15 - y; ew = wx; }
    if (open[2] && x < d) { d = x; ew = wy; }
    if (open[3] && 15 - x < d) { d = 15 - x; ew = wy; }
    if (d < 99) {
      const wv = 2 + Math.round(Math.sin(ew * 0.7) + Math.sin(ew * 0.31));
      if (d < wv) col = d === wv - 1 ? C.g1 : C.g2;
      else if (d === wv) col = C.d1;
    }
    P(c, col, ox + x, oy + y);
  }
  for (let k = 0; k < 2; k++) {                       // kerikil
    const h = hash(tx, ty, 30 + k);
    if (h % 3) continue;
    const x = 5 + ((h >>> 4) % 6), y = 5 + ((h >>> 9) % 6);
    R(c, C.d0, ox + x, oy + y + 1, 3, 1); R(c, C.d4, ox + x, oy + y, 2, 1);
  }
}

function drawWater(c, ox, oy, tx, ty) {
  R(c, C.w1, ox, oy, TS, TS);
  const open = [!isWater(tx, ty - 1), !isWater(tx, ty + 1), !isWater(tx - 1, ty), !isWater(tx + 1, ty)];
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    let d = 99;
    if (open[0]) d = Math.min(d, y);
    if (open[1]) d = Math.min(d, 15 - y);
    if (open[2]) d = Math.min(d, x);
    if (open[3]) d = Math.min(d, 15 - x);
    if (d === 0) P(c, C.g1, ox + x, oy + y);
    else if (d === 1) P(c, C.s2, ox + x, oy + y);
    else if (d === 2) P(c, C.s1, ox + x, oy + y);
    else if (d === 3) P(c, C.w3, ox + x, oy + y);
    else if (d === 4) P(c, C.w2, ox + x, oy + y);
  }
}

function drawField(c, ox, oy, tx, ty) {
  R(c, C.soil1, ox, oy, TS, TS);
  for (let y = 0; y < TS; y += 4) { R(c, C.soil0, ox, oy + y + 3, TS, 1); R(c, C.soil2, ox, oy + y, TS, 1); }   // alur bajak
}

function buildGround() {
  const cv = mk(MW * TS, MH * TS), c = cv.getContext("2d");
  for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
    const t = map[ty][tx], ox = tx * TS, oy = ty * TS;
    if (t === ROAD) drawRoad(c, ox, oy, tx, ty);
    else if (t === WATER) drawWater(c, ox, oy, tx, ty);
    else if (t === FIELD) drawField(c, ox, oy, tx, ty);
    else drawGrass(c, ox, oy, tx, ty);
    if (t === FOREST) { c.fillStyle = "rgba(30,70,30,0.35)"; c.fillRect(ox, oy, TS, TS); }
  }
  return cv;
}

// ================================================================ objek: pohon, palem, rumah, kebun, lampu
function makeTree(seed, fruit) {
  const p = new Pix(32, 40);
  p.shape([C.wood1, C.wood2, C.wood0], all(rrect(13, 24, 6, 14, 2), poly([[10, 38], [22, 38], [19, 33], [13, 33]])));
  const canopy = all(ell(16, 13, 12, 10), ell(8, 19, 7, 6), ell(24, 19, 7, 6), ell(16, 22, 9, 5));
  p.shape([C.g2, C.g3, C.g1], canopy, 2);
  const m = p.mask(canopy), s = p.shift(m, -4, -4);   // bayangan dalam yang lebar di kanan bawah
  p.paint(C.g1, m.map((v, i) => v && !s[i]));
  p.paint(C.g0, m.map((v, i) => v && !p.shift(m, -1, -1)[i]));
  p.shape([C.g4, C.g5], all(ell(11, 9, 4, 3), ell(19, 7, 3, 2)));   // kilau daun
  for (let k = 0; k < 9; k++) {                        // gumpal daun
    const h = hash(seed, k, 7), x = 6 + (h % 20), y = 8 + ((h >>> 5) % 13);
    if (m[y * 32 + x]) { p.dot(C.g1, x, y); p.dot(C.g1, x + 1, y); p.dot(C.g3, x, y - 1); }
  }
  if (fruit) for (let k = 0; k < 5; k++) {
    const h = hash(seed, k, 9), x = 7 + (h % 18), y = 11 + ((h >>> 5) % 10);
    if (m[y * 32 + x]) { p.rect(fruit[0], x, y, 2, 2); p.dot(fruit[1], x, y); }
  }
  p.outline();
  return p.canvas();
}

function makePalm(seed) {
  const p = new Pix(32, 48), bend = seed % 2 ? 1 : -1;
  for (let i = 0; i < 9; i++) {                        // batang beruas
    const t = i / 8, x = 15 + bend * 5 * t * t, y = 44 - i * 3.6;
    p.shape([C.wood2, C.wood3, C.wood1], ell(x, y, 2.6 - t * 0.5, 2.2), 1);
  }
  const cx = 15 + bend * 5, cy = 14;
  const fronds = [[-2.6, 13], [-2.0, 12], [-1.2, 11], [-0.4, 10], [0.4, 10], [1.2, 11], [2.0, 12], [2.6, 13], [Math.PI / 2, 9]];
  for (const [a, len] of fronds) {
    const fx = cx + Math.cos(a - Math.PI / 2) * len * 0.55, fy = cy + Math.sin(a - Math.PI / 2) * len * 0.45 + Math.abs(Math.sin(a)) * 3;
    p.shape([C.g2, C.g4, C.g0], ell(fx, fy, len * 0.6, 2.2, a - Math.PI / 2), 1);
  }
  for (const [kx, ky] of [[-2, 1], [2, 1], [0, 3]]) p.shape(["#8a6a2a", "#b8984a"], ell(cx + kx, cy + ky, 1.6, 1.6));
  p.outline();
  return p.canvas();
}

function makeHouse(roof) {
  const p = new Pix(64, 58);
  const W = [C.wall1, C.wall2, C.wall0];
  p.shape(W, rrect(6, 26, 52, 28, 2));                 // dinding
  for (let y = 31; y < 54; y += 5) p.rect(C.wall0, 7, y, 50, 1);   // papan
  p.shape(["#9a9aa8", "#c8c8d4", "#6a6a7a"], rrect(4, 52, 56, 5, 2));   // pondasi batu
  p.shape([C.wood1, C.wood2, C.wood0], rrect(26, 34, 12, 19, 2));   // pintu
  p.rect(C.wood0, 31, 36, 2, 16); p.shape(["#f8d040", "#fff0a0"], ell(35, 44, 1.2, 1.2));
  for (const x of [10, 42]) {                          // jendela
    p.shape([C.wood1, C.wood2, C.wood0], rrect(x - 1, 32, 14, 13, 2));
    p.shape([C.w2, C.w4, C.w1], rrect(x + 1, 34, 10, 9, 1));
    p.rect(C.wood1, x + 5, 34, 1, 9); p.rect(C.wood1, x + 1, 38, 10, 1);
    p.shape([C.wood2, C.wood3, C.wood1], rrect(x - 1, 45, 14, 3, 1));    // pot bunga
    for (let k = 0; k < 4; k++) p.shape([["#ff7a9a", "#ffd050", "#ffffff", "#ff9a50"][k], "#ffffff"], ell(x + 1.5 + k * 3, 44, 1.6, 1.4));
  }
  p.shape([roof[0], roof[1], roof[2]], poly([[0, 31], [64, 31], [55, 6], [9, 6]]), 2);   // atap tebal
  for (let y = 11; y < 31; y += 5) p.rect(roof[2], 3, y, 58, 1);
  p.shape([roof[1], "#ffffff"], rrect(9, 5, 46, 4, 2));   // bubungan

// ================================================================ karakter chibi 24 x 32
const CW = 24, CHH = 32;
function composeChar(o, dir, frame) {
  const p = new Pix(CW, CHH);
  const bob = frame ? 1 : 0;
  const side = dir === "left", up = dir === "up";
  const skin = [o.skin[0], o.skin[1], o.skin[2]], top = o.top, hair = o.hair;
  const shoe = [o.shoe[0], o.shoe[1], dark(o.shoe[0], 0.75)];
  const pants = [o.pants[0], o.pants[1], dark(o.pants[0], 0.75)];
  // kaki atau rok
  if (o.dress) {
    p.shape(top, poly([[7, 23 - bob], [17, 23 - bob], [20, 29 - bob], [4, 29 - bob]]), 1);
    p.rect(top[2], 5, 28 - bob, 14, 1);
    const fl = side ? [[11 + (frame === 1 ? -2 : frame === 2 ? 2 : 0), frame ? 1 : 0]] : [[9, frame === 2 ? 1 : 0], [15, frame === 1 ? 1 : 0]];
    for (const [x, lift] of fl) p.shape(shoe, ell(x, 30.5 - lift, 2.2, 1.4));
  } else {
    const legs = side
      ? [[12 - (frame === 1 ? -2 : frame === 2 ? 2 : 0), frame === 1 ? 1 : 0, true], [12 + (frame === 1 ? -2 : frame === 2 ? 2 : 0), frame === 2 ? 1 : 0, false]]
      : [[9.5, frame === 2 ? 1 : 0, false], [14.5, frame === 1 ? 1 : 0, false]];
    for (const [x, lift, back] of legs) {
      p.shape(back ? [pants[2], pants[2]] : pants, rrect(x - 1.8, 24 - bob, 3.6, 5 - lift, 1));
      p.shape(back ? [shoe[2], shoe[2]] : shoe, ell(x + (side ? -0.8 : 0), 29.6 - lift, side ? 2.6 : 2.1, 1.5));
    }
  }
  // badan
  if (side) p.shape(top, rrect(8, 17 - bob, 9, 9, 3), 1);
  else p.shape(top, rrect(6.5, 17 - bob, 11, 9, 3.5), 1);
  if (o.detail) o.detail(p, dir, bob);
  // lengan
  const sw = frame === 0 ? 0 : frame === 1 ? 1 : -1;
  if (side) {
    p.shape(top, ell(12.5 + sw, 21 - bob, 2, 3.4), 1);
    p.shape(skin, ell(12.5 + sw * 1.5, 24.4 - bob, 1.6, 1.5));
  } else {
    for (const [x, s] of [[5.6, sw], [18.4, -sw]]) {
      p.shape(top, ell(x, 21 - bob + (up ? 0 : s * 0.5), 2, 3.4), 1);
      p.shape(skin, ell(x, 24.4 - bob + s * 0.5, 1.6, 1.5));
    }
  }
  // kepala
  const hy = 11 - bob;
  if (!up) p.shape(skin, side ? ell(15, hy + 1, 1.3, 1.9) : all(ell(3.6, hy + 1.5, 1.3, 1.9), ell(20.4, hy + 1.5, 1.3, 1.9)));   // telinga
  p.shape(skin, side ? ell(11, hy, 8.2, 7.6) : ell(12, hy, 8.6, 7.8), 1);
  // wajah
  if (!up) {
    const eyes = side ? [6] : [8, 15];
    for (const ex of eyes) {
      p.rect("#2a1e30", ex, hy, 2, 4);
      p.dot("#ffffff", ex, hy); p.dot("#5a4a8a", ex + 1, hy + 3);
      if (o.lashes) p.rect("#2a1e30", ex - (side ? 1 : ex < 12 ? 1 : 0), hy - 1, 3, 1);
    }
    for (const bx of side ? [5] : [6, 17]) p.rect("#f4a0a0", bx, hy + 4, 2, 1);
    if (side) p.rect(dark(o.skin[0], 0.7), 4, hy + 5, 2, 1);
    else p.rect(dark(o.skin[0], 0.7), 11, hy + 5, 2, 1);
  }
  // rambut
  o.hairStyle(p, dir, hy, hair);
  if (o.extra) o.extra(p, dir, hy, bob);
  p.outline();
  return p.canvas();
}

// Cari jalur terpendek 4 arah (BFS), null jika tidak bisa dicapai
function findPath(sx, sy, ex, ey) {
  if (!walkable(ex, ey)) return null;
  const key = (x, y) => y * MW + x;
  const prev = new Map([[key(sx, sy), null]]);
  const queue = [[sx, sy]];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    if (x === ex && y === ey) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!walkable(nx, ny) || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), [x, y]);
      queue.push([nx, ny]);
    }
  }
  if (!prev.has(key(ex, ey))) return null;
  const path = [];
  for (let c = [ex, ey]; key(c[0], c[1]) !== key(sx, sy); c = prev.get(key(c[0], c[1]))) path.push(c);
  return path.reverse();
}

function update(dt) {
  if (dlg.npc) {
    dlg.shown = Math.min(dlg.npc.lines[dlg.line].length, dlg.shown + CPS * dt);
    player.walk = 0;
    return;
  }
  let move = SPEED * dt;
  let moved = false;
  while (move > 0) {
    const gx = player.tx * TS, gy = player.ty * TS;
    if (player.x === gx && player.y === gy) {
      const next = player.path.shift();
      if (!next) { target.x = -1; break; }
      player.dir = dirTo(next[0] - player.tx, next[1] - player.ty);
      player.tx = next[0]; player.ty = next[1];
      continue;
    }
    const dx = gx - player.x, dy = gy - player.y;
    const dist = Math.abs(dx) + Math.abs(dy);
    moved = true;
    if (move >= dist) {
      player.x = gx; player.y = gy; move -= dist;
    } else {
      player.x += Math.sign(dx) * move; player.y += Math.sign(dy) * move; move = 0;
    }
  }
  player.walk = moved ? player.walk + dt : 0;
  if (pending && atRest()) { if (adjacent(pending)) openDialog(pending); else pending = null; }
}

}

function ripples(now) {                            // riak air

  R(ctx, "#4a2a18", x, y + 1, w, h - 2); R(ctx, "#4a2a18", x + 1, y, w - 2, h);
  R(ctx, C.wood1, x + 1, y + 1, w - 2, h - 2);
  R(ctx, C.wood2, x + 2, y + 2, w - 4, 1); R(ctx, C.wood0, x + 2, y + h - 3, w - 4, 1);
  R(ctx, "#4a2a18", x + 4, y + 4, w - 8, h - 8);
  R(ctx, "#fff4d8", x + 5, y + 5, w - 10, h - 10);
  R(ctx, "#f2e2b8", x + 5, y + h - 7, w - 10, 2);
  // potret
  R(ctx, "#4a2a18", x + 8, y + 8, 30, 28); R(ctx, "#cfe8f8", x + 9, y + 9, 28, 26);
  R(ctx, "#a8d8a0", x + 9, y + 28, 28, 7);
  ctx.save(); ctx.beginPath(); ctx.rect(x + 9, y + 9, 28, 26); ctx.clip();
  ctx.drawImage(portrait(dlg.npc.char), x + 11, y + 12, 24, 22);
  ctx.restore();
  // nama
  const nw = textW(dlg.npc.name) + 10;
  R(ctx, "#4a2a18", x + 8, y - 8, nw, 13);
  R(ctx, "#f8b84a", x + 9, y - 7, nw - 2, 11); R(ctx, "#ffe09a", x + 9, y - 7, nw - 2, 1);
  drawText(ctx, dlg.npc.name, x + 13, y - 5, "#4a2a18");
  const text = dlg.npc.lines[dlg.line];
  let start = 0;
  wrapText(text, w - 56).forEach((ln, i) => {
    const part = ln.slice(0, Math.max(0, Math.floor(dlg.shown) - start));
    drawText(ctx, part, x + 44, y + 10 + i * 10, "#4a2a18");
    start += ln.length + 1;
  });
  if (dlg.shown >= text.length && Math.floor(now / 400) % 2 === 0) {
    const ax = x + w - 15, ay = y + h - 14;
    R(ctx, "#d86a2a", ax, ay, 7, 1); R(ctx, "#d86a2a", ax + 1, ay + 1, 5, 1);
    R(ctx, "#d86a2a", ax + 2, ay + 2, 3, 1); R(ctx, "#d86a2a", ax + 3, ay + 3, 1, 1);
  }
}

// ================================================================ input
// Tap layar menjadi tile tujuan
canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (dlg.npc) { advanceDialog(); return; }
  const r = canvas.getBoundingClientRect();
  const wx = (e.clientX - r.left) * VW / r.width + cam.x, wy = (e.clientY - r.top) * VH / r.height + cam.y;
  let tx = Math.floor(wx / TS), ty = Math.floor(wy / TS);
  // sprite NPC lebih tinggi dari tile, jadi tap di badan atau kepalanya juga dihitung
  const hitNpc = NPCS.find((n) => wx >= n.tx * TS - 2 && wx < n.tx * TS + TS + 2 && wy >= n.ty * TS - 17 && wy < n.ty * TS + TS);
  if (hitNpc) { tx = hitNpc.tx; ty = hitNpc.ty; }
  const npc = npcAt(tx, ty);
  if (npc) {
    if (adjacent(npc)) { player.path = []; openDialog(npc); return; }
    const spots = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dx, dy]) => findPath(player.tx, player.ty, tx + dx, ty + dy))
      .filter(Boolean)
      .sort((a, b) => a.length - b.length);
    if (!spots.length) return;
    player.path = spots[0]; pending = npc;
    const end = spots[0][spots[0].length - 1];
    target.x = end[0]; target.y = end[1];
    return;
  }
  const path = findPath(player.tx, player.ty, tx, ty);
  if (!path) return;
  pending = null;
  player.path = path;
  target.x = tx; target.y = ty;
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

// Skala bilangan bulat agar piksel tetap tajam
function fit() {
  const s = Math.max(1, Math.floor(Math.min(innerWidth / VW, innerHeight / VH)));
  canvas.style.width = VW * s + "px";
  canvas.style.height = VH * s + "px";
}
addEventListener("resize", fit);
fit();

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  updateCamera();
  render(now);
  requestAnimationFrame(frame);
}
updateCamera();
requestAnimationFrame(frame);

// Dipakai untuk uji otomatis: posisi layar (piksel CSS) dari tengah tile
function tileToScreen(tx, ty) {
  const r = canvas.getBoundingClientRect(), k = r.width / VW;
  return { x: r.left + (tx * TS + 8 - cam.x) * k, y: r.top + (ty * TS + 8 - cam.y) * k, left: r.left, top: r.top, w: r.width, h: r.height };
}
window.__recursio = { VW, VH, TS, MW, MH, map, player, cam, target, dlg, NPCS, SPR, treeSpr, palmSpr, houseSpr, cropSpr, lampSpr, tileToScreen };
</script>
