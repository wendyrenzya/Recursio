<script type="module">
import * as THREE from "./lib/three.module.min.js";

// ================================================================ dasar
// Logika memakai satuan piksel tile 16. Dunia 3D memakai 1 unit = 1 tile.
const VW = 180, VH = 320, TS = 16, SPEED = 64;
const GRASS = 0, ROAD = 1, HOUSE = 2, TREE = 3, WATER = 4, FOREST = 5, PALM = 6, LAMP = 7, FIELD = 8;   // tipe > 1 menghalangi jalan
const hash = (x, y, s = 0) => {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1274126177)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};
const rnd = (x, y, s) => (hash(x, y, s) % 10000) / 10000;
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const P = (c, col, x, y) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
const R = (c, col, x, y, w, h) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
const C = { wood0: "#6e4228", wood1: "#93603a", wood2: "#b8814c" };   // warna kotak dialog

// ================================================================ font bitmap 5x7
// Tiap karakter 7 baris (9 untuk huruf berekor g j p q y), 5 bit per baris.
const FONT_SRC = {
  " ": "00 00 00 00 00 00 00",
  "A": "0E 11 11 1F 11 11 11", "B": "1E 11 11 1E 11 11 1E", "C": "0E 11 10 10 10 11 0E",
  "D": "1E 11 11 11 11 11 1E", "E": "1F 10 10 1E 10 10 1F", "F": "1F 10 10 1E 10 10 10",
  "G": "0E 11 10 17 11 11 0F", "H": "11 11 11 1F 11 11 11", "I": "0E 04 04 04 04 04 0E",
  "J": "07 02 02 02 02 12 0C", "K": "11 12 14 18 14 12 11", "L": "10 10 10 10 10 10 1F",
  "M": "11 1B 15 15 11 11 11", "N": "11 11 19 15 13 11 11", "O": "0E 11 11 11 11 11 0E",
  "P": "1E 11 11 1E 10 10 10", "Q": "0E 11 11 11 15 12 0D", "R": "1E 11 11 1E 14 12 11",
  "S": "0F 10 10 0E 01 01 1E", "T": "1F 04 04 04 04 04 04", "U": "11 11 11 11 11 11 0E",
  "V": "11 11 11 11 11 0A 04", "W": "11 11 11 15 15 15 0A", "X": "11 11 0A 04 0A 11 11",
  "Y": "11 11 11 0A 04 04 04", "Z": "1F 01 02 04 08 10 1F",
  "a": "00 00 0E 01 0F 11 0F", "b": "10 10 16 19 11 11 1E", "c": "00 00 0E 10 10 11 0E",
  "d": "01 01 0D 13 11 11 0F", "e": "00 00 0E 11 1F 10 0E", "f": "06 09 08 1C 08 08 08",
  "g": "00 00 0F 11 11 11 0F 01 0E", "h": "10 10 16 19 11 11 11", "i": "04 00 0C 04 04 04 0E",
  "j": "02 00 06 02 02 02 02 12 0C", "k": "10 10 12 14 18 14 12", "l": "0C 04 04 04 04 04 0E",
  "m": "00 00 1A 15 15 11 11", "n": "00 00 16 19 11 11 11", "o": "00 00 0E 11 11 11 0E",
  "p": "00 00 1E 11 11 11 1E 10 10", "q": "00 00 0F 11 11 11 0F 01 01", "r": "00 00 16 19 10 10 10",
  "s": "00 00 0E 10 0E 01 1E", "t": "08 08 1C 08 08 09 06", "u": "00 00 11 11 11 13 0D",
  "v": "00 00 11 11 11 0A 04", "w": "00 00 11 11 15 15 0A", "x": "00 00 11 0A 04 0A 11",
  "y": "00 00 11 11 11 11 0F 01 0E", "z": "00 00 1F 02 04 08 1F",
  "0": "0E 11 13 15 19 11 0E", "1": "04 0C 04 04 04 04 0E", "2": "0E 11 01 02 04 08 1F",
  "3": "1F 02 04 02 01 11 0E", "4": "02 06 0A 12 1F 02 02", "5": "1F 10 1E 01 01 11 0E",
  "6": "06 08 10 1E 11 11 0E", "7": "1F 01 02 04 08 08 08", "8": "0E 11 11 0E 11 11 0E",
  "9": "0E 11 11 0F 01 02 0C",
  ".": "00 00 00 00 00 0C 0C", ",": "00 00 00 00 0C 04 08", "!": "04 04 04 04 04 00 04",
  "?": "0E 11 01 02 04 00 04", ":": "00 0C 0C 00 0C 0C 00", "'": "0C 04 08 00 00 00 00",
  "-": "00 00 00 1F 00 00 00", "(": "02 04 08 08 08 04 02", ")": "08 04 02 02 02 04 08",
};
const FONT = {};
for (const [ch, src] of Object.entries(FONT_SRC)) {
  const rows = src.split(" ").map((h) => parseInt(h, 16));
  let w = 0;
  for (const r of rows) for (let b = 0; b < 5; b++) if (r & (16 >> b)) w = Math.max(w, b + 1);
  FONT[ch] = { rows, w: ch === " " ? 3 : w };
}
const textW = (s) => [...s].reduce((a, ch) => a + (FONT[ch] || FONT["?"]).w + 1, 0) - 1;
function drawText(c, s, x, y, col, shadow) {
  let cx = x;
  for (const ch of s) {
    const g = FONT[ch] || FONT["?"];
    g.rows.forEach((r, j) => {
      for (let b = 0; b < g.w; b++) if (r & (16 >> b)) {
        if (shadow) P(c, shadow, cx + b + 1, y + j + 1);
        P(c, col, cx + b, y + j);
      }
    });
    cx += g.w + 1;
  }
}

// ================================================================ peta
const MW = 20, MH = 32;
const map = Array.from({ length: MH }, () => new Array(MW).fill(GRASS));
const fill = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j][i] = t; };
fill(0, 0, MW, 1, FOREST); fill(0, MH - 1, MW, 1, FOREST);   // pepohonan di pinggir peta
fill(0, 0, 1, MH, FOREST); fill(MW - 1, 0, 1, MH, FOREST);
fill(9, 1, 2, MH - 2, ROAD);                                  // jalan utama
fill(1, 20, 18, 2, ROAD);                                     // jalan melintang
fill(3, 4, 4, 3, HOUSE);  fill(4, 7, 6, 1, ROAD);             // rumah Nino dan jalannya
fill(13, 4, 4, 3, HOUSE); fill(10, 7, 6, 1, ROAD);            // rumah Kael dan jalannya
fill(13, 24, 5, 4, WATER);                                    // kolam
fill(3, 10, 4, 2, FIELD);                                     // kebun sayur Ibu Nino
const put = (t, pts) => pts.forEach(([x, y]) => { map[y][x] = t; });
put(TREE, [[2, 13], [3, 15], [15, 12], [17, 14], [16, 17], [2, 17], [6, 28], [17, 19]]);
put(PALM, [[7, 11], [13, 11], [1, 24], [4, 25], [12, 29], [18, 23], [7, 16], [14, 17], [2, 28]]);
put(LAMP, [[8, 6], [11, 19], [8, 22]]);
const tileAt = (x, y) => (x >= 0 && y >= 0 && x < MW && y < MH ? map[y][x] : FOREST);

const baseWalkable = (x, y) =>
  x >= 0 && y >= 0 && x < MW && y < MH && (map[y][x] === GRASS || map[y][x] === ROAD);

// ================================================================ keadaan permainan
const NPCS = [
  { name: "Ibu Nino", tx: 6, ty: 8, char: "ibu", dir: "down",
    lines: [
      "Nino, so malam baru pulang. Torang so masak ikan cakalang, makan dulu.",
      "Ibu dengar gempa makin sering. HP-mu juga sering error to?",
      "Kalau bajumu so kotor, bawa ke Ibu. Ibu cuci, gratis.",
    ] },
  { name: "Nenek Kael", tx: 12, ty: 8, char: "nenek", dir: "down",
    lines: [
      "Oh, Nino. Kael ada di dalam, main game terus dari tadi.",
      "Anak itu kelihatan malas, tapi Nenek tahu dia sedang berjuang.",
      "Kalau ada yang rusak, bawa ke Nenek. Nenek perbaiki.",
    ] },
];
const npcAt = (x, y) => NPCS.find((n) => n.tx === x && n.ty === y);
const walkable = (x, y) => baseWalkable(x, y) && !npcAt(x, y);

const player = { tx: 9, ty: 3, x: 9 * TS, y: 3 * TS, path: [], dir: "down", walk: 0 };
const target = { x: -1, y: -1 };
const cam = { x: 0, z: 0 };                      // titik fokus kamera dalam satuan tile
const dlg = { npc: null, line: 0, shown: 0 };   // npc null berarti dialog tertutup
let pending = null;                              // NPC yang akan diajak bicara setelah sampai
const CPS = 40;                                  // karakter per detik

const adjacent = (n) => Math.abs(n.tx - player.tx) + Math.abs(n.ty - player.ty) === 1;
const atRest = () => player.x === player.tx * TS && player.y === player.ty * TS && player.path.length === 0;
const dirTo = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
function openDialog(n) {
  dlg.npc = n; dlg.line = 0; dlg.shown = 0;
  n.dir = dirTo(player.tx - n.tx, player.ty - n.ty);
  player.dir = dirTo(n.tx - player.tx, n.ty - player.ty);
  pending = null; target.x = -1;
}
function advanceDialog() {
  const text = dlg.npc.lines[dlg.line];
  if (dlg.shown < text.length) { dlg.shown = text.length; return; }
  if (++dlg.line >= dlg.npc.lines.length) { dlg.npc.dir = "down"; dlg.npc = null; return; }
  dlg.shown = 0;
}

// Cari jalur terpendek 4 arah (BFS), null jika tidak bisa dicapai
function findPath(sx, sy, ex, ey) {
  if (!walkable(ex, ey)) return null;
  const key = (x, y) => y * MW + x;
  const prev = new Map([[key(sx, sy), null]]);
  const queue = [[sx, sy]];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    if (x === ex && y === ey) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!walkable(nx, ny) || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), [x, y]);
      queue.push([nx, ny]);
    }
  }
  if (!prev.has(key(ex, ey))) return null;
  const path = [];
  for (let c = [ex, ey]; key(c[0], c[1]) !== key(sx, sy); c = prev.get(key(c[0], c[1]))) path.push(c);
  return path.reverse();
}

function update(dt) {
  if (dlg.npc) {
    dlg.shown = Math.min(dlg.npc.lines[dlg.line].length, dlg.shown + CPS * dt);
    player.walk = 0;
    return;
  }
  let move = SPEED * dt;
  let moved = false;
  while (move > 0) {
    const gx = player.tx * TS, gy = player.ty * TS;
    if (player.x === gx && player.y === gy) {
      const next = player.path.shift();
      if (!next) { target.x = -1; break; }
      player.dir = dirTo(next[0] - player.tx, next[1] - player.ty);
      player.tx = next[0]; player.ty = next[1];
      continue;
    }
    const dx = gx - player.x, dy = gy - player.y;
    const dist = Math.abs(dx) + Math.abs(dy);
    moved = true;
    if (move >= dist) {
      player.x = gx; player.y = gy; move -= dist;
    } else {
      player.x += Math.sign(dx) * move; player.y += Math.sign(dy) * move; move = 0;
    }
  }
  player.walk = moved ? player.walk + dt : 0;
  if (pending && atRest()) { if (adjacent(pending)) openDialog(pending); else pending = null; }
}

// Fokus kamera mengikuti Nino, dibatasi agar tetap di dalam peta
const CAM_BOUNDS = { x0: 5.5, x1: MW - 5.5, z0: 8, z1: MH - 4.5 };
function updateCamera() {
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  cam.x = clamp(player.x / TS + 0.5, CAM_BOUNDS.x0, CAM_BOUNDS.x1);
  cam.z = clamp(player.y / TS + 0.5, CAM_BOUNDS.z0, CAM_BOUNDS.z1);
}

// ================================================================ dunia 3D low-poly
const glCanvas = document.getElementById("gl");
const uiCanvas = document.getElementById("ui");
const ctx = uiCanvas.getContext("2d");
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const SKY = "#9ed8ff";
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 42, 70);

const PITCH = THREE.MathUtils.degToRad(42), DIST = 30, FOV = 30;
const camera = new THREE.PerspectiveCamera(FOV, 9 / 16, 1, 200);

const sun = new THREE.DirectionalLight("#fff1d6", 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 20, bottom: -20, near: 1, far: 80 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight("#cfeaff", "#8a7a52", 1.5));

// material flat shading, disimpan per warna agar tidak berulang
const matCache = {};
function mat(color, extra) {
  const key = color + (extra ? JSON.stringify(extra) : "");
  if (!matCache[key]) matCache[key] = new THREE.MeshLambertMaterial({ color, flatShading: true, ...(extra || {}) });
  return matCache[key];
}
function add(parent, geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, extra) {
  const m = new THREE.Mesh(geo, mat(color, extra));
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (p, w, h, d, col, x, y, z, rx, ry, rz, extra) => add(p, new THREE.BoxGeometry(w, h, d), col, x, y, z, rx, ry, rz, extra);
const cyl = (p, rt, rb, h, seg, col, x, y, z, rx, ry, rz) => add(p, new THREE.CylinderGeometry(rt, rb, h, seg), col, x, y, z, rx, ry, rz);
const ball = (p, r, col, x, y, z, sx = 1, sy = 1, sz = 1, detail = 1) => { const m = add(p, new THREE.IcosahedronGeometry(r, detail), col, x, y, z); m.scale.set(sx, sy, sz); return m; };
const cone = (p, r, h, seg, col, x, y, z, rx, ry, rz) => add(p, new THREE.ConeGeometry(r, h, seg), col, x, y, z, rx, ry, rz);

// ---------------------------------------------------------------- tanah per tile dengan warna vertex
const isWater = (x, y) => tileAt(x, y) === WATER;
const GROUND_COL = {
  grass: ["#72c44c", "#75c74e", "#70c24a", "#77c950"],
  road: ["#d6a868", "#d4a666", "#d8aa6a"],
  field: ["#8a5a36", "#80532f"],
  forest: ["#4f9a3a", "#559f3e"],
  sand: "#ecd9a0", pondBed: "#4a9ac8",
};
function buildGround() {
  const pos = [], col = [], c = new THREE.Color();
  const quad = (a, b, d, e, color) => {
    pos.push(...a, ...b, ...d, ...a, ...d, ...e);
    c.set(color).convertSRGBToLinear();
    for (let i = 0; i < 6; i++) col.push(c.r, c.g, c.b);
  };
  const MARGIN = 10;
  for (let ty = -MARGIN; ty < MH + MARGIN; ty++) for (let tx = -MARGIN; tx < MW + MARGIN; tx++) {
    const t = tileAt(tx, ty), h = hash(tx, ty, 5);
    let color = GROUND_COL.grass[h % 4], y = 0;
    if (t === ROAD || t === HOUSE) color = GROUND_COL.road[h % 3];
    if (t === FIELD) color = GROUND_COL.field[h % 2];
    if (t === FOREST) color = GROUND_COL.forest[h % 2];
    if (t === WATER) { color = GROUND_COL.pondBed; y = -0.35; }
    quad([tx, y, ty + 1], [tx + 1, y, ty + 1], [tx + 1, y, ty], [tx, y, ty], color);
    if (t === WATER) {                                 // dinding pasir di tepi kolam
      if (!isWater(tx, ty - 1)) quad([tx, -0.35, ty], [tx + 1, -0.35, ty], [tx + 1, 0, ty], [tx, 0, ty], GROUND_COL.sand);
      if (!isWater(tx, ty + 1)) quad([tx + 1, -0.35, ty + 1], [tx, -0.35, ty + 1], [tx, 0, ty + 1], [tx + 1, 0, ty + 1], GROUND_COL.sand);
      if (!isWater(tx - 1, ty)) quad([tx, -0.35, ty + 1], [tx, -0.35, ty], [tx, 0, ty], [tx, 0, ty + 1], GROUND_COL.sand);
      if (!isWater(tx + 1, ty)) quad([tx + 1, -0.35, ty], [tx + 1, -0.35, ty + 1], [tx + 1, 0, ty + 1], [tx + 1, 0, ty], GROUND_COL.sand);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  m.receiveShadow = true;
  scene.add(m);
}
buildGround();

// kolam: air bergelombang
const waterGeo = new THREE.PlaneGeometry(5, 4, 10, 8);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, new THREE.MeshLambertMaterial({ color: "#58b4f0", transparent: true, opacity: 0.82, flatShading: true }));
water.position.set(13 + 2.5, -0.08, 24 + 2);
scene.add(water);
const waterBase = waterGeo.attributes.position.array.slice();

// ---------------------------------------------------------------- instancing: rumput, bunga, pohon, palem
function instanced(geo, color, list, cast = true) {   // list: [x, y, z, rx, ry, rz, sx, sy, sz, warna?]
  const m = new THREE.InstancedMesh(geo, mat(color), list.length);
  const o = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((v, i) => {
    o.position.set(v[0], v[1], v[2]); o.rotation.set(v[3] || 0, v[4] || 0, v[5] || 0);
    o.scale.set(v[6] || 1, v[7] || v[6] || 1, v[8] || v[6] || 1); o.updateMatrix();
    m.setMatrixAt(i, o.matrix);
    if (v[9]) m.setColorAt(i, c.set(v[9]));
  });
  m.castShadow = cast; m.receiveShadow = true;
  scene.add(m);
  return m;
}
const tufts = [], flowers = [], trunks = [], canopies = [], palmSeg = [], palmLeaf = [], coconuts = [], fruits = [];
const FLOWER_COL = ["#ffffff", "#ffe050", "#ff8ab0", "#a8c8ff"];
function plantTree(x, z, s, seed, fruit) {
  trunks.push([x, 0.45 * s, z, 0, 0, 0, s, s, s]);
  const greens = ["#4caf50", "#5cbf52", "#45a24a"];
  const blobs = [[0, 1.35, 0, 0.62], [-0.38, 1.1, 0.12, 0.42], [0.4, 1.12, 0.05, 0.44], [0.05, 1.05, 0.38, 0.4], [0.1, 1.72, -0.05, 0.38]];
  blobs.forEach(([bx, by, bz, r], k) => {
    canopies.push([x + bx * s, by * s, z + bz * s, rnd(seed, k, 1), rnd(seed, k, 2) * 3, 0, r * s * 1.6, r * s * 1.45, r * s * 1.6, greens[(seed + k) % 3]]);
    if (fruit && k < 4) for (let f = 0; f < 2; f++)
      fruits.push([x + (bx + (rnd(seed, k * 3 + f, 3) - 0.5) * r) * s, (by - 0.1 + (rnd(seed, f, k) - 0.3) * r) * s, z + (bz + r * 0.9) * s]);
  });
}
function plantPalm(x, z, seed) {
  const bend = seed % 2 ? 1 : -1;
  let px = x, py = 0;
  for (let i = 0; i < 7; i++) {                      // batang beruas melengkung
    const t = i / 6, lean = bend * 0.18 * t;
    palmSeg.push([px, py + 0.17, z, 0, 0, -lean, 1.4 - t * 0.35, 1, 1.4 - t * 0.35]);
    px += Math.sin(lean) * 0.32; py += 0.32;
  }
  for (let k = 0; k < 7; k++) {                      // daun menjuntai
    const a = (k / 7) * Math.PI * 2 + seed;
    palmLeaf.push([px + Math.cos(a) * 0.45, py - 0.05, z + Math.sin(a) * 0.45, 0, -a, 0.45, 1, 1, 1, k % 2 ? "#5cbf52" : "#72d260"]);
  }
  for (let k = 0; k < 3; k++) coconuts.push([px + Math.cos(k * 2.1) * 0.13, py - 0.12, z + Math.sin(k * 2.1) * 0.13]);
}
for (let ty = -10; ty < MH + 10; ty++) for (let tx = -10; tx < MW + 10; tx++) {
  const t = tileAt(tx, ty), h = hash(tx, ty, 7);
  if (t === GRASS) {
    for (let k = 0; k < 3; k++) if (rnd(tx, ty, 20 + k) < 0.55)
      tufts.push([tx + rnd(tx, ty, 30 + k), 0.06, ty + rnd(tx, ty, 40 + k), 0, rnd(tx, ty, k), 0, 0.8 + rnd(tx, ty, 50 + k) * 0.6]);
    if (h % 7 === 0) for (let k = 0; k < 3; k++)
      flowers.push([tx + 0.2 + rnd(tx, ty, 60 + k) * 0.6, 0.1, ty + 0.2 + rnd(tx, ty, 70 + k) * 0.6, 0, 0, 0, 1, 1, 1, FLOWER_COL[(h >>> 4) % 4]]);
  }
  if (t === TREE) plantTree(tx + 0.5, ty + 0.5, 1, h % 97, h % 3 === 1);
  if (t === PALM) plantPalm(tx + 0.5, ty + 0.5, h % 97);
  if (t === FOREST && h % 10 < 8) plantTree(tx + 0.5 + (rnd(tx, ty, 8) - 0.5) * 0.5, ty + 0.5 + (rnd(tx, ty, 9) - 0.5) * 0.5, 1.1 + rnd(tx, ty, 10) * 0.5, h % 97, false);
}
instanced(new THREE.ConeGeometry(0.05, 0.16, 3), "#4e9e36", tufts, false);
instanced(new THREE.IcosahedronGeometry(0.05, 0), "#ffffff", flowers, false);
instanced(new THREE.CylinderGeometry(0.1, 0.16, 0.9, 6), "#8a5a34", trunks);

function prism(w, h, d) {                            // atap pelana, bubungan sejajar sumbu x
  const s = new THREE.Shape();
  s.moveTo(-d / 2, 0); s.lineTo(d / 2, 0); s.lineTo(0, h); s.lineTo(-d / 2, 0);
  const g = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false });
  g.translate(0, 0, -w / 2); g.rotateY(Math.PI / 2);
  return g;
}

function buildChar(o) {

    : [limb(-0.11, 0.4, 0.15, 0.3, 0.15, o.pants, o.shoe, [0.17, 0.09, 0.24]), limb(0.11, 0.4, 0.15, 0.3, 0.15, o.pants, o.shoe, [0.17, 0.09, 0.24])];

  const arms = [limb(-0.27, 0.76, 0.11, 0.3, 0.12, o.sleeve || o.top, o.skin, [0.1, 0.1, 0.1]), limb(0.27, 0.76, 0.11, 0.3, 0.12, o.sleeve || o.top, o.skin, [0.1, 0.1, 0.1])];
  arms[0].rotation.z = -0.12; arms[1].rotation.z = 0.12;
  const head = new THREE.Group(); head.position.set(0, 1.1, 0); body.add(head);
  ball(head, 0.34, o.skin, 0, 0, 0, 1, 0.95, 0.92);
  for (const s of [-1, 1]) ball(head, 0.07, o.skin, s * 0.32, -0.02, 0, 1, 1.2, 1, 0);   // telinga
  // wajah
  for (const s of [-1, 1]) {

    if (!o.sleepy) box(head, 0.03, 0.03, 0.02, "#ffffff", s * 0.12 - 0.02, 0.02, 0.32);
    box(head, 0.08, 0.025, 0.02, o.hair[1], s * 0.12, o.sleepy ? 0.04 : 0.1, 0.3);      // alis
    box(head, 0.07, 0.035, 0.02, "#f49a9a", s * 0.19, -0.11, 0.27);                     // pipi merona
  }
  box(head, 0.07, 0.025, 0.02, "#a04a3a", 0, -0.15, 0.3);                               // mulut

function poseActor(a, x, z, dir, walk, dt) {
  a.root.position.set(x, 0, z);
  let d = DIR_YAW[dir] - a.yaw;                       // berputar halus ke arah tujuan
  d = Math.atan2(Math.sin(d), Math.cos(d));
  a.yaw += d * Math.min(1, dt * 14);
  a.root.rotation.y = a.yaw;
  const s = walk > 0 ? Math.sin(walk * 11) : 0;
  a.legs[0].rotation.x = s * 0.7; a.legs[1].rotation.x = -s * 0.7;
  a.arms[0].rotation.x = -s * 0.8; a.arms[1].rotation.x = s * 0.8;
  a.body.position.y = walk > 0 ? Math.abs(Math.sin(walk * 11)) * 0.06 : 0;
}

  Object.assign(view, { w, h });
  const wrap = document.getElementById("wrap");
  wrap.style.width = w + "px"; wrap.style.height = h + "px";
  uiCanvas.style.width = w + "px"; uiCanvas.style.height = h + "px";
  renderer.setPixelRatio(RETRO_W / w);
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener("resize", fit);
fit();

function placeCamera() {
  camera.position.set(cam.x, DIST * Math.sin(PITCH), cam.z + DIST * Math.cos(PITCH));
  camera.lookAt(cam.x, 0, cam.z);
  camera.updateMatrixWorld();
  sun.position.set(cam.x - 6, 24, cam.z + 7);
  sun.target.position.set(cam.x, 0, cam.z - 2);
}

// ================================================================ render
let lastT = 0;
function render(now) {
  const t = now / 1000, dt = Math.min(0.05, t - lastT || 0); lastT = t;
  placeCamera();
  poseActor(playerActor, player.x / TS + 0.5, player.y / TS + 0.5, player.dir, player.walk, dt);
  for (const n of NPCS) poseActor(n.actor, n.tx + 0.5, n.ty + 0.5, n.dir, 0, dt);
  marker.visible = target.x >= 0;
  if (marker.visible) { marker.position.set(target.x + 0.5, 0.03, target.y + 0.5); marker.material.opacity = 0.5 + 0.5 * Math.sin(t * 8); }
  const a = waterGeo.attributes.position;
  for (let i = 0; i < a.count; i++) a.array[i * 3 + 1] = waterBase[i * 3 + 1] + Math.sin(t * 2 + waterBase[i * 3] * 2.1 + waterBase[i * 3 + 2] * 1.7) * 0.04;
  a.needsUpdate = true; waterGeo.computeVertexNormals();
  renderer.render(scene, camera);
  ctx.clearRect(0, 0, VW, VH);
  if (dlg.npc) drawDialog(now);
}

// potret pembicara: kepala karakter dirender sekali ke kanvas kecil
const portraits = {};
function portrait(key) {
  if (portraits[key]) return portraits[key];
  const W = 28, H = 26, rt = new THREE.WebGLRenderTarget(W, H);
  const ps = new THREE.Scene(); ps.background = new THREE.Color("#bfe6ff");
  ps.add(new THREE.HemisphereLight("#ffffff", "#8a7a52", 2.2));
  const dl = new THREE.DirectionalLight("#fff1d6", 1.6); dl.position.set(-1, 2, 3); ps.add(dl);
  const a = buildChar(CHARS[key]); ps.add(a.root);
  const pc = new THREE.PerspectiveCamera(30, W / H, 0.1, 20);
  pc.position.set(0, 1.46, 2.6); pc.lookAt(0, 1.3, 0);
  renderer.setRenderTarget(rt); renderer.render(ps, pc); renderer.setRenderTarget(null);
  const buf = new Uint8Array(W * H * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, W, H, buf);
  const cv = mk(W, H), c = cv.getContext("2d"), img = c.createImageData(W, H);
  for (let y = 0; y < H; y++) img.data.set(buf.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  c.putImageData(img, 0, 0);
  rt.dispose();
  return (portraits[key] = cv);
}

function wrapText(text, maxW) {
  const out = [];
  let line = "";
  for (const w of text.split(" ")) {
    const t = line ? line + " " + w : w;
    if (line && textW(t) > maxW) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

// Kotak dialog: kertas krem berbingkai kayu, wajah pembicara di kiri
// Kotak dialog: kertas krem berbingkai kayu, wajah pembicara di kiri
function drawDialog(now) {
  const x = 4, y = 232, w = VW - 8, h = 84;
  R(ctx, "#4a2a18", x, y + 1, w, h - 2); R(ctx, "#4a2a18", x + 1, y, w - 2, h);
  R(ctx, C.wood1, x + 1, y + 1, w - 2, h - 2);
  R(ctx, C.wood2, x + 2, y + 2, w - 4, 1); R(ctx, C.wood0, x + 2, y + h - 3, w - 4, 1);
  R(ctx, "#4a2a18", x + 4, y + 4, w - 8, h - 8);
  R(ctx, "#fff4d8", x + 5, y + 5, w - 10, h - 10);
  R(ctx, "#f2e2b8", x + 5, y + h - 7, w - 10, 2);
  // potret
  R(ctx, "#4a2a18", x + 8, y + 8, 30, 28); R(ctx, "#cfe8f8", x + 9, y + 9, 28, 26);
  R(ctx, "#a8d8a0", x + 9, y + 28, 28, 7);
  ctx.save(); ctx.beginPath(); ctx.rect(x + 9, y + 9, 28, 26); ctx.clip();
  ctx.drawImage(portrait(dlg.npc.char), x + 9, y + 9);
  ctx.restore();
  // nama
  const nw = textW(dlg.npc.name) + 10;
  R(ctx, "#4a2a18", x + 8, y - 8, nw, 13);
  R(ctx, "#f8b84a", x + 9, y - 7, nw - 2, 11); R(ctx, "#ffe09a", x + 9, y - 7, nw - 2, 1);
  drawText(ctx, dlg.npc.name, x + 13, y - 5, "#4a2a18");
  const text = dlg.npc.lines[dlg.line];
  let start = 0;
  wrapText(text, w - 56).forEach((ln, i) => {
    const part = ln.slice(0, Math.max(0, Math.floor(dlg.shown) - start));
    drawText(ctx, part, x + 44, y + 10 + i * 10, "#4a2a18");
    start += ln.length + 1;
  });
  if (dlg.shown >= text.length && Math.floor(now / 400) % 2 === 0) {
    const ax = x + w - 15, ay = y + h - 14;
    R(ctx, "#d86a2a", ax, ay, 7, 1); R(ctx, "#d86a2a", ax + 1, ay + 1, 5, 1);
    R(ctx, "#d86a2a", ax + 2, ay + 2, 3, 1); R(ctx, "#d86a2a", ax + 3, ay + 3, 1, 1);
  }
}

// ================================================================ input
// Tap: sinar dari kamera. Kena NPC berarti ajak bicara, selain itu tile di tanah jadi tujuan.
const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
glCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (dlg.npc) { advanceDialog(); return; }
  const r = glCanvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  placeCamera();
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(NPCS.map((n) => n.actor.root), true)[0];
  let tx, ty;
  if (hit) { const n = NPCS.find((q) => { let o = hit.object; while (o) { if (o === q.actor.root) return true; o = o.parent; } return false; }); tx = n.tx; ty = n.ty; }
  else {
    const p = ray.ray.intersectPlane(groundPlane, new THREE.Vector3());
    if (!p) return;
    tx = Math.floor(p.x); ty = Math.floor(p.z);
  }
  const npc = npcAt(tx, ty);
  if (npc) {
    if (adjacent(npc)) { player.path = []; openDialog(npc); return; }
    const spots = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dx, dy]) => findPath(player.tx, player.ty, tx + dx, ty + dy))
      .filter(Boolean)
      .sort((a, b) => a.length - b.length);
    if (!spots.length) return;
    player.path = spots[0]; pending = npc;
    const end = spots[0][spots[0].length - 1];
    target.x = end[0]; target.y = end[1];
    return;
  }
  const path = findPath(player.tx, player.ty, tx, ty);
  if (!path) return;
  pending = null;
  player.path = path;
  target.x = tx; target.y = ty;
});
glCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  updateCamera();
  render(now);
  requestAnimationFrame(frame);
}
updateCamera();
requestAnimationFrame(frame);

// Dipakai untuk uji otomatis: posisi layar (piksel CSS) dari tengah tile di tanah
function tileToScreen(tx, ty) {
  placeCamera();
  const p = new THREE.Vector3(tx + 0.5, 0, ty + 0.5).project(camera);
  const r = glCanvas.getBoundingClientRect();
  return { x: r.left + (p.x * 0.5 + 0.5) * r.width, y: r.top + (-p.y * 0.5 + 0.5) * r.height, left: r.left, top: r.top, w: r.width, h: r.height };
}
window.__recursio = { VW, VH, TS, MW, MH, map, player, cam, target, dlg, NPCS, CHARS, CAM_BOUNDS, tileToScreen, scene, camera, buildChar };
</script>
