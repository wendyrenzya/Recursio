<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Recursio</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; overscroll-behavior: none; }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  #gl, #ui { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  #ui { image-rendering: pixelated; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="gl"></canvas><canvas id="ui" width="180" height="320"></canvas></div>
<script type="module">
import * as THREE from "./lib/three.module.min.js";

// ================================================================ dasar
// Logika memakai satuan piksel tile 16. Dunia 3D memakai 1 unit = 1 tile.
const VW = 180, VH = 320, TS = 16, SPEED = 64;
const GRASS = 0, ROAD = 1, HOUSE = 2, TREE = 3, WATER = 4, FOREST = 5, PALM = 6, LAMP = 7;   // tipe > 1 menghalangi jalan

const hash = (x, y, s = 0) => {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1274126177)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
const P = (c, col, x, y) => { c.fillStyle = col; c.fillRect(x, y, 1, 1); };
const R = (c, col, x, y, w, h) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

// ================================================================ palet
const C = {
  ol: "#1c1630",
  g0: "#1b4332", g1: "#2a6038", g2: "#3a7d44", g3: "#51a050", g4: "#7cc263", g5: "#b1de7c",
  d0: "#4a3427", d1: "#6b4d38", d2: "#8c6a48", d3: "#a98558", d4: "#c4a36d", d5: "#dcc08a",
  s2: "#d8c08a", s3: "#ecdcaa",
  w0: "#1f3a6b", w1: "#2c5594", w2: "#3a74b8", w3: "#5c9bd6", w4: "#9ccbe8", w5: "#e4f4fa",
  r0: "#5e2234", r1: "#8c3340", r2: "#b94a47", r3: "#d9694f", r4: "#ef9a68",
  t0: "#3a424f", t1: "#58667a", t2: "#7b8ca3", t3: "#a6b6c9", t4: "#d3deea",
  b0: "#3b2430", b1: "#5c3a38", b2: "#855436", b3: "#a8744a", b4: "#cf9a66",
  wl0: "#a8884f", wl1: "#c8a661", wl2: "#e0c27c", wl3: "#f0dc9e",
  gy1: "#6a6678", gy2: "#908ca0", gy3: "#b9b6c6",
  glow0: "#ffb547", glow1: "#ffd88a", glow2: "#fff4cf",
};

// ================================================================ font bitmap 5x7
// Tiap karakter 7 baris (9 untuk huruf berekor g j p q y), 5 bit per baris.
const FONT_SRC = {
  " ": "00 00 00 00 00 00 00",
  "A": "0E 11 11 1F 11 11 11", "B": "1E 11 11 1E 11 11 1E", "C": "0E 11 10 10 10 11 0E",
  "D": "1E 11 11 11 11 11 1E", "E": "1F 10 10 1E 10 10 1F", "F": "1F 10 10 1E 10 10 10",
  "G": "0E 11 10 17 11 11 0F", "H": "11 11 11 1F 11 11 11", "I": "0E 04 04 04 04 04 0E",
  "J": "07 02 02 02 02 12 0C", "K": "11 12 14 18 14 12 11", "L": "10 10 10 10 10 10 1F",
  "M": "11 1B 15 15 11 11 11", "N": "11 11 19 15 13 11 11", "O": "0E 11 11 11 11 11 0E",
  "P": "1E 11 11 1E 10 10 10", "Q": "0E 11 11 11 15 12 0D", "R": "1E 11 11 1E 14 12 11",
  "S": "0F 10 10 0E 01 01 1E", "T": "1F 04 04 04 04 04 04", "U": "11 11 11 11 11 11 0E",
  "V": "11 11 11 11 11 0A 04", "W": "11 11 11 15 15 15 0A", "X": "11 11 0A 04 0A 11 11",
  "Y": "11 11 11 0A 04 04 04", "Z": "1F 01 02 04 08 10 1F",
  "a": "00 00 0E 01 0F 11 0F", "b": "10 10 16 19 11 11 1E", "c": "00 00 0E 10 10 11 0E",
  "d": "01 01 0D 13 11 11 0F", "e": "00 00 0E 11 1F 10 0E", "f": "06 09 08 1C 08 08 08",
  "g": "00 00 0F 11 11 11 0F 01 0E", "h": "10 10 16 19 11 11 11", "i": "04 00 0C 04 04 04 0E",
  "j": "02 00 06 02 02 02 02 12 0C", "k": "10 10 12 14 18 14 12", "l": "0C 04 04 04 04 04 0E",
  "m": "00 00 1A 15 15 11 11", "n": "00 00 16 19 11 11 11", "o": "00 00 0E 11 11 11 0E",
  "p": "00 00 1E 11 11 11 1E 10 10", "q": "00 00 0F 11 11 11 0F 01 01", "r": "00 00 16 19 10 10 10",
  "s": "00 00 0E 10 0E 01 1E", "t": "08 08 1C 08 08 09 06", "u": "00 00 11 11 11 13 0D",
  "v": "00 00 11 11 11 0A 04", "w": "00 00 11 11 15 15 0A", "x": "00 00 11 0A 04 0A 11",
  "y": "00 00 11 11 11 11 0F 01 0E", "z": "00 00 1F 02 04 08 1F",
  "0": "0E 11 13 15 19 11 0E", "1": "04 0C 04 04 04 04 0E", "2": "0E 11 01 02 04 08 1F",
  "3": "1F 02 04 02 01 11 0E", "4": "02 06 0A 12 1F 02 02", "5": "1F 10 1E 01 01 11 0E",
  "6": "06 08 10 1E 11 11 0E", "7": "1F 01 02 04 08 08 08", "8": "0E 11 11 0E 11 11 0E",
  "9": "0E 11 11 0F 01 02 0C",
  ".": "00 00 00 00 00 0C 0C", ",": "00 00 00 00 0C 04 08", "!": "04 04 04 04 04 00 04",
  "?": "0E 11 01 02 04 00 04", ":": "00 0C 0C 00 0C 0C 00", "'": "0C 04 08 00 00 00 00",
  "-": "00 00 00 1F 00 00 00", "(": "02 04 08 08 08 04 02", ")": "08 04 02 02 02 04 08",
};
const FONT = {};
for (const [ch, src] of Object.entries(FONT_SRC)) {
  const rows = src.split(" ").map((h) => parseInt(h, 16));
  let w = 0;
  for (const r of rows) for (let b = 0; b < 5; b++) if (r & (16 >> b)) w = Math.max(w, b + 1);
  FONT[ch] = { rows, w: ch === " " ? 3 : w };
}
const textW = (s) => [...s].reduce((a, ch) => a + (FONT[ch] || FONT["?"]).w + 1, 0) - 1;
function drawText(c, s, x, y, col, shadow) {
  let cx = x;
  for (const ch of s) {
    const g = FONT[ch] || FONT["?"];
    g.rows.forEach((r, j) => {
      for (let b = 0; b < g.w; b++) if (r & (16 >> b)) {
        if (shadow) P(c, shadow, cx + b + 1, y + j + 1);
        P(c, col, cx + b, y + j);
      }
    });
    cx += g.w + 1;
  }
}

// ================================================================ peta
const MW = 20, MH = 32, M = 8;   // M: lebar hutan di luar peta, hanya untuk pemandangan
const map = Array.from({ length: MH }, () => new Array(MW).fill(GRASS));
const fill = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j][i] = t; };
fill(0, 0, MW, 1, FOREST); fill(0, MH - 1, MW, 1, FOREST);   // hutan di pinggir peta
fill(0, 0, 1, MH, FOREST); fill(MW - 1, 0, 1, MH, FOREST);
fill(9, 1, 2, MH - 2, ROAD);                                  // jalan utama
fill(1, 20, 18, 2, ROAD);                                     // jalan melintang
fill(3, 4, 4, 3, HOUSE);  fill(4, 7, 6, 1, ROAD);             // rumah Nino dan jalannya
fill(13, 4, 4, 3, HOUSE); fill(10, 7, 6, 1, ROAD);            // rumah Kael dan jalannya
fill(13, 24, 5, 4, WATER);                                    // kolam
const put = (t, pts) => pts.forEach(([x, y]) => { map[y][x] = t; });
put(TREE, [[2, 11], [3, 14], [15, 12], [17, 14], [16, 17], [2, 17], [6, 28], [17, 19]]);
put(PALM, [[7, 11], [13, 11], [1, 24], [4, 25], [12, 29], [18, 23], [7, 16], [14, 17], [2, 28]]);
put(LAMP, [[8, 6], [11, 19], [8, 22]]);
const tileAt = (x, y) => (x >= 0 && y >= 0 && x < MW && y < MH ? map[y][x] : FOREST);

const baseWalkable = (x, y) =>
  x >= 0 && y >= 0 && x < MW && y < MH && (map[y][x] === GRASS || map[y][x] === ROAD);

// ================================================================ tekstur tanah (digambar sekali)
const isRoadLike = (x, y) => { const t = tileAt(x, y); return t === ROAD || t === HOUSE; };
const isWater = (x, y) => tileAt(x, y) === WATER;

function drawGrass(c, ox, oy, tx, ty) {
  R(c, C.g2, ox, oy, TS, TS);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const h = hash(tx * TS + x, ty * TS + y, 1) % 100;
    if (h < 6) P(c, C.g3, ox + x, oy + y); else if (h < 11) P(c, C.g1, ox + x, oy + y);
  }
  for (let k = 0; k < 2; k++) {                       // rumpun rumput kecil
    const h = hash(tx, ty, 10 + k);
    if (h % 3 === 0) continue;
    const x = 2 + (h >>> 4) % 12, y = 3 + (h >>> 9) % 11;
    P(c, C.g4, ox + x, oy + y - 1); P(c, C.g3, ox + x - 1, oy + y); P(c, C.g4, ox + x + 1, oy + y);
    P(c, C.g1, ox + x, oy + y);
  }
  const f = hash(tx, ty, 20) % 11;                    // bunga
  if (f < 2) {
    const cols = [["#f4f0e6", "#f2c94c"], ["#f08aa8", "#f2c94c"], ["#f2c94c", "#e07a2c"]][hash(tx, ty, 21) % 3];
    for (let k = 0; k < 2; k++) {
      const x = 3 + (hash(tx, ty, 22 + k) % 10), y = 4 + (hash(tx, ty, 24 + k) % 9);
      P(c, C.g1, ox + x, oy + y + 1);
      P(c, cols[0], ox + x - 1, oy + y); P(c, cols[0], ox + x + 1, oy + y);
      P(c, cols[0], ox + x, oy + y - 1); P(c, cols[1], ox + x, oy + y);
    }
  }
}

function drawRoad(c, ox, oy, tx, ty) {
  const open = [!isRoadLike(tx, ty - 1), !isRoadLike(tx, ty + 1),
                !isRoadLike(tx - 1, ty), !isRoadLike(tx + 1, ty)];            // atas, bawah, kiri, kanan
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const wx = tx * TS + x, wy = ty * TS + y;
    const h = hash(wx, wy, 3) % 100;
    let col = h < 14 ? C.d4 : h < 24 ? C.d2 : C.d3;
    if (h > 96) col = C.d1;
    let d = 99, ew = 0;                               // jarak ke sisi yang berbatasan dengan rumput
    if (open[0] && y < d) { d = y; ew = wx; }
    if (open[1] && 15 - y < d) { d = 15 - y; ew = wx; }
    if (open[2] && x < d) { d = x; ew = wy; }
    if (open[3] && 15 - x < d) { d = 15 - x; ew = wy; }
    if (d < 99) {
      const wv = 2 + (hash(ew, 7, 5) % 3 === 0 ? 1 : 0);
      if (d < wv - 1) col = hash(wx, wy, 6) % 3 ? C.g2 : C.g1;
      else if (d === wv - 1) col = C.d1;
      else if (d === wv) col = C.d2;
    }
    P(c, col, ox + x, oy + y);
  }
  for (let k = 0; k < 2; k++) {                       // kerikil
    const h = hash(tx, ty, 30 + k);
    if (h % 4) continue;
    const x = 4 + (h >>> 4) % 7, y = 4 + (h >>> 9) % 7;
    P(c, C.d1, ox + x, oy + y + 1); P(c, C.d1, ox + x + 1, oy + y + 1); P(c, C.d5, ox + x, oy + y);
  }
}

function drawWater(c, ox, oy, tx, ty) {
  R(c, C.w1, ox, oy, TS, TS);
  for (let y = 0; y < TS; y++) if ((ty * TS + y) % 5 === 0) R(c, C.w0, ox, oy + y, TS, 1);
  const open = [!isWater(tx, ty - 1), !isWater(tx, ty + 1), !isWater(tx - 1, ty), !isWater(tx + 1, ty)];
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    let d = 99;
    if (open[0]) d = Math.min(d, y);
    if (open[1]) d = Math.min(d, 15 - y);
    if (open[2]) d = Math.min(d, x);
    if (open[3]) d = Math.min(d, 15 - x);
    if (d === 0) P(c, C.d1, ox + x, oy + y);
    else if (d === 1) P(c, C.s2, ox + x, oy + y);
    else if (d === 2) P(c, C.s3, ox + x, oy + y);
    else if (d === 3 && hash(tx * TS + x, ty * TS + y, 8) % 3) P(c, C.w3, ox + x, oy + y);
  }
}

function drawForest(c, ox, oy, tx, ty) {
  R(c, C.g0, ox, oy, TS, TS);
  for (let k = 0; k < 4; k++) {
    const h = hash(tx, ty, 40 + k);
    const bx = (h % 14) + 1, by = ((h >>> 5) % 12) + 2, br = 3 + ((h >>> 10) % 3);
    for (let y = -br; y <= br; y++) for (let x = -br; x <= br; x++) {
      if (x * x + y * y > br * br) continue;
      const px = bx + x, py = by + y;
      if (px < 0 || py < 0 || px >= TS || py >= TS) continue;
      const v = (-x * 0.6 - y * 0.9) / br + (hash(tx * TS + px, ty * TS + py, 9) % 5) * 0.1;
      P(c, v > 0.6 ? C.g2 : v > -0.2 ? C.g1 : C.g0, ox + px, oy + py);
    }
  }
}

function buildGround() {
  const cv = mk((MW + 2 * M) * TS, (MH + 2 * M) * TS), c = cv.getContext("2d");
  for (let ty = -M; ty < MH + M; ty++) for (let tx = -M; tx < MW + M; tx++) {
    const t = tileAt(tx, ty), ox = (tx + M) * TS, oy = (ty + M) * TS;
    if (t === ROAD) drawRoad(c, ox, oy, tx, ty);
    else if (t === WATER) drawWater(c, ox, oy, tx, ty);
    else if (t === FOREST) drawForest(c, ox, oy, tx, ty);
    else drawGrass(c, ox, oy, tx, ty);
  }
  return cv;
}

// ================================================================ sprite pohon, palem, lampu (32 x 48)
function makeTree(seed) {
  const w = 32, h = 48, cv = mk(w, h), c = cv.getContext("2d");
  R(c, C.ol, 13, 30, 6, 17); R(c, C.b3, 14, 30, 1, 16); R(c, C.b2, 15, 30, 2, 16); R(c, C.b1, 17, 30, 1, 16);   // batang
  R(c, C.ol, 10, 44, 12, 3); R(c, C.b2, 11, 44, 10, 2); R(c, C.b1, 17, 44, 4, 2); P(c, C.b4, 14, 33); P(c, C.b4, 14, 38);
  const circles = [[16, 14, 11], [8, 21, 7], [24, 21, 7], [16, 25, 8], [10, 11, 7], [22, 11, 7]];
  const mask = (x, y) => circles.some(([cx, cy, r]) => (x - cx) ** 2 + (y - cy) ** 2 <= r * r);
  for (let y = 0; y < 36; y++) for (let x = 0; x < w; x++) {
    if (!mask(x, y)) continue;
    if (!mask(x, y - 1) || !mask(x, y + 1) || !mask(x - 1, y) || !mask(x + 1, y)) { P(c, "#132a1d", x, y); continue; }
    // gumpalan daun: tiap gumpal punya terang sendiri, ditambah arah cahaya kiri atas
    const cl = Math.floor(x / 5) + Math.floor((y + (Math.floor(x / 5) % 2) * 2) / 5) * 7;
    const inner = ((x % 5) + (y % 5)) / 8;
    const v = 1 - Math.hypot(x - 10, y - 7) / 26 + (hash(cl, seed, 4) % 3) * 0.06 - inner * 0.18 + (hash(x, y, seed) % 3) * 0.03;
    const ramp = [C.g0, C.g1, C.g2, C.g3, C.g4, C.g5];
    P(c, ramp[Math.max(0, Math.min(5, Math.floor(v * 6.2)))], x, y);
  }
  return cv;
}

function makePalm(seed) {
  const w = 32, h = 48, cv = mk(w, h), c = cv.getContext("2d");
  const bend = seed % 2 ? 1 : -1;
  let cx = 16, cy = 16;
  for (let y = 47; y >= 16; y--) {                    // batang melengkung bercincin
    const t = (47 - y) / 31;
    const x = Math.round(15 + bend * 5 * t * t);
    R(c, C.ol, x - 1, y, 5, 1);
    R(c, C.b3, x, y, 3, 1); P(c, C.b4, x, y); P(c, C.b1, x + 2, y);
    if (y % 3 === 0) R(c, C.b1, x, y, 3, 1);
    if (y === 16) { cx = x + 1; cy = y; }
  }
  R(c, C.ol, 11, 47, 11, 1);
  const fronds = [[-15, 3, 7], [-13, -5, 5], [-6, -12, 3], [5, -12, 3], [13, -5, 5], [15, 3, 7], [-3, 6, 5], [4, 6, 5]];
  for (const [dx, dy, droop] of fronds) {
    const n = Math.max(Math.abs(dx), Math.abs(dy)) + 3;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const x = Math.round(cx + dx * t), y = Math.round(cy + dy * t + droop * t * t);
      const th = t < 0.35 ? 2 : t < 0.8 ? 1 : 0;
      for (let k = -th; k <= th + 1; k++) P(c, k <= -th ? C.g4 : k > th ? C.g0 : (k < 0 ? C.g3 : C.g2), x, y + k);
      if (i % 2 === 0 && t > 0.15 && t < 0.92) {     // helai menjuntai
        P(c, C.g1, x, y + th + 2); P(c, C.g0, x, y + th + 3);
      }
    }
  }
  for (const [kx, ky] of [[-2, 1], [1, 1], [-1, 3]]) {   // kelapa
    R(c, "#2a3a1c", cx + kx, cy + ky, 2, 2); P(c, "#6f8a3a", cx + kx, cy + ky);
  }
  return cv;
}

function makeLamp(glowOnly) {
  const cv = mk(16, 40), c = cv.getContext("2d");
  if (!glowOnly) {
    R(c, C.ol, 6, 10, 4, 30); R(c, "#3c3448", 7, 10, 2, 29); P(c, "#6a6080", 7, 14); P(c, "#6a6080", 7, 22);
    R(c, C.ol, 4, 36, 8, 4); R(c, "#3c3448", 5, 36, 6, 3);
    R(c, C.ol, 3, 1, 10, 11); R(c, "#2a2433", 4, 0, 8, 2);
  }
  R(c, C.glow0, 4, 3, 8, 7); R(c, C.glow1, 5, 4, 6, 5); R(c, C.glow2, 6, 5, 4, 3);
  if (!glowOnly) { R(c, C.ol, 7, 3, 2, 7); R(c, C.ol, 4, 6, 8, 1); }
  return cv;
}

// ================================================================ tekstur rumah
function wallCanvas(w, h, door, windows, glowOnly) {
  const cv = mk(w, h), c = cv.getContext("2d");
  if (glowOnly) R(c, "#000", 0, 0, w, h);
  else for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let col = x % 5 === 0 ? C.wl0 : (y % 8 === 7 ? C.wl1 : C.wl2);
    if (x % 5 === 1) col = C.wl3;
    if (y < 3) col = x % 5 === 0 ? C.b2 : C.wl0;      // bayangan di bawah atap
    if (y >= h - 3) col = y === h - 3 ? C.gy2 : C.gy1;   // pondasi
    P(c, col, x, y);
  }
  for (const x0 of windows) {
    if (!glowOnly) { R(c, C.ol, x0, 5, 12, 10); R(c, C.b3, x0 + 1, 6, 10, 8); }
    R(c, C.glow0, x0 + 2, 7, 8, 6); R(c, C.glow1, x0 + 2, 7, 5, 4); R(c, C.glow2, x0 + 3, 8, 2, 2);
    if (!glowOnly) {
      R(c, C.b3, x0 + 5, 7, 1, 6); R(c, C.b3, x0 + 2, 10, 8, 1); R(c, C.r1, x0 + 7, 7, 3, 3);
      R(c, C.b2, x0, 15, 12, 2); R(c, C.ol, x0, 17, 12, 1);
    }
  }
  if (door !== null && !glowOnly) {
    const x0 = door;
    R(c, C.ol, x0, 3, 12, h - 4); R(c, C.b2, x0 + 1, 4, 10, h - 6); R(c, C.b3, x0 + 2, 5, 3, h - 9); R(c, C.b1, x0 + 6, 5, 4, h - 9);
    R(c, C.b4, x0 + 2, 5, 1, h - 9); P(c, C.d5, x0 + 9, 13); P(c, C.d3, x0 + 9, 14);
    R(c, C.gy3, x0 - 1, h - 3, 14, 3); R(c, C.gy2, x0 - 1, h - 1, 14, 1);
  }
  return cv;
}

function roofCanvas(style) {
  const cv = mk(32, 32), c = cv.getContext("2d");
  const rf = style === "tin" ? [C.t0, C.t1, C.t2, C.t3, C.t4] : [C.r0, C.r1, C.r2, C.r3, C.r4];
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    let col;
    if (style === "tin") {
      col = [rf[3], rf[2], rf[2], rf[1]][x % 4];
      if (y % 16 === 15) col = rf[0];
      if (y % 16 === 0) col = rf[4];
    } else {
      const row = Math.floor(y / 4), sx = (x + (row % 2) * 4) % 8;
      col = row % 2 ? rf[2] : rf[3];
      if (sx === 0) col = rf[1];
      if (y % 4 === 3) col = rf[0];
      if (y % 4 === 0 && sx !== 0) col = rf[4];
      if (sx === 7 && y % 4 !== 3) col = rf[1];
    }
    P(c, col, x, y);
  }
  return cv;
}

// ================================================================ karakter 16 x 24, 4 arah, 3 frame
const c16 = (s) => { const l = (16 - s.length) >> 1; return ".".repeat(l) + s + ".".repeat(16 - s.length - l); };
const HEAD = {

function composeChar(o, dir, frame) {
  const cv = mk(16, 24), c = cv.getContext("2d");
  const pal = { o: o.ol || "#241a2e", h: o.hair[0], H: o.hair[1], s: o.skin[0], S: o.skin[1], e: "#2a1d2e",
                t: o.top[0], T: o.top[1], L: o.top[2], p: o.pants[0], P: o.pants[1], b: o.shoe[0], B: o.shoe[1],
                a: o.accent || "#f0d8c0", k: "#2a2a3a" };
  const bob = frame ? 1 : 0;                          // badan naik 1 piksel saat melangkah
  const put = (rows, y0) => rows.forEach((row, j) => [...row].forEach((ch, x) => {
    if (ch !== ".") P(c, pal[ch], x, y0 + j - bob);
  }));
  const side = dir === "left";
  put(HEAD[dir], 1);
  put(o.dress ? TORSO[dir].map((r, i) => (i === 5 ? r.replace(/p/g, "t") : r)) : TORSO[dir], 13);
  const leg = (x0, lift, dark) => {                   // kaki: celana, sepatu, garis luar
    const top = 19 - bob, n = 3 - lift;
    R(c, pal.o, x0 - 1, top, 5, n + 2);
    R(c, dark ? pal.P : pal.p, x0, top, 3, n);
    if (!dark) R(c, pal.P, x0 + 2, top, 1, n);
    R(c, pal.b, x0, top + n, 3, 1); P(c, pal.B, x0, top + n);
  };
  if (o.dress) {
    R(c, pal.o, 3, 19 - bob, 10, 1); R(c, pal.t, 4, 19 - bob, 8, 1);
    R(c, pal.o, 2, 20 - bob, 12, 2); R(c, pal.t, 3, 20 - bob, 10, 1); R(c, pal.T, 3, 21 - bob, 10, 1);
    P(c, pal.L, 4, 20 - bob); P(c, pal.L, 5, 20 - bob);
    const foot = (x0, lift) => { R(c, pal.s, x0 + 1, 22 - lift - bob, 2, 1); R(c, pal.b, x0, 23 - lift - bob, 3, 1); };
    if (side) foot(6, frame === 1 ? 1 : 0);
    else { foot(4, frame === 2 ? 1 : 0); foot(9, frame === 1 ? 1 : 0); }
  } else if (side) {
    const f = frame === 0 ? 0 : (frame === 1 ? -2 : 2);
    leg(6 - f, frame === 1 ? 1 : 0, true);            // kaki belakang
    leg(6 + f, frame === 2 ? 1 : 0, false);
  } else {
    leg(4, frame === 2 ? 1 : 0, false);
    leg(9, frame === 1 ? 1 : 0, false);
  }
  for (const [x, y, ch] of (o.patch && o.patch[dir]) || []) P(c, pal[ch] || ch, x, y - bob);
  return cv;
}

function makeSheet(o) {
  const cv = mk(16 * 12, 24), c = cv.getContext("2d");
  for (let f = 0; f < 3; f++) {
    c.drawImage(composeChar(o, "down", f), f * 16, 0);
    c.drawImage(composeChar(o, "up", f), (3 + f) * 16, 0);
    const l = composeChar(o, "left", f);
    c.drawImage(l, (6 + f) * 16, 0);
    c.save(); c.translate((9 + f) * 16 + 16, 0); c.scale(-1, 1); c.drawImage(l, 0, 0); c.restore();
  }
  return cv;
}

// Cari jalur terpendek 4 arah (BFS), null jika tidak bisa dicapai
function findPath(sx, sy, ex, ey) {
  if (!walkable(ex, ey)) return null;
  const key = (x, y) => y * MW + x;
  const prev = new Map([[key(sx, sy), null]]);
  const queue = [[sx, sy]];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    if (x === ex && y === ey) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!walkable(nx, ny) || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), [x, y]);
      queue.push([nx, ny]);
    }
  }
  if (!prev.has(key(ex, ey))) return null;
  const path = [];
  for (let c = [ex, ey]; key(c[0], c[1]) !== key(sx, sy); c = prev.get(key(c[0], c[1]))) path.push(c);
  return path.reverse();
}

function update(dt) {
  if (dlg.npc) {
    dlg.shown = Math.min(dlg.npc.lines[dlg.line].length, dlg.shown + CPS * dt);
    player.walk = 0;
    return;
  }
  let move = SPEED * dt;
  let moved = false;
  while (move > 0) {
    const gx = player.tx * TS, gy = player.ty * TS;
    if (player.x === gx && player.y === gy) {
      const next = player.path.shift();
      if (!next) { target.x = -1; break; }
      player.dir = dirTo(next[0] - player.tx, next[1] - player.ty);
      player.tx = next[0]; player.ty = next[1];
      continue;
    }
    const dx = gx - player.x, dy = gy - player.y;
    const dist = Math.abs(dx) + Math.abs(dy);
    moved = true;
    if (move >= dist) {
      player.x = gx; player.y = gy; move -= dist;
    } else {
      player.x += Math.sign(dx) * move; player.y += Math.sign(dy) * move; move = 0;
    }
  }
  player.walk = moved ? player.walk + dt : 0;
  if (pending && atRest()) { if (adjacent(pending)) openDialog(pending); else pending = null; }
}

function addHouse(tx, tz, style) {
  const W = 3.7, D = 1.9, H = 1.5, RH = 1.15, OV = 0.32;
  const x0 = tx + 0.15, x1 = x0 + W, zB = tz + 0.85, zF = zB + D, zM = (zB + zF) / 2;

  const side = pix(wallCanvas(30, 24, null, [9], false));
  const sideGlow = pix(wallCanvas(30, 24, null, [9], true));
  const plain = pix(wallCanvas(60, 24, null, [], false));
  const lit = (map, glow) => new THREE.MeshLambertMaterial(glow ? { map, emissiveMap: glow, emissive: new THREE.Color("#ffb860"), emissiveIntensity: 2.4 } : { map });
  const box = new THREE.Mesh(new THREE.BoxGeometry(W, H, D),
    [lit(side, sideGlow), lit(side, sideGlow), lit(plain), lit(plain), lit(front, frontGlow), lit(plain)]);
  box.position.set((x0 + x1) / 2, H / 2, zM);
  box.castShadow = box.receiveShadow = true;
  scene.add(box);
  // atap: dua bidang miring dan dua segitiga pelana
  const yE = H - 0.12, yR = H + RH, zEF = zF + OV, zEB = zB - OV, xa = x0 - 0.22, xb = x1 + 0.22;
  const slope = Math.hypot(zEF - zM, yR - yE);
  const ru = (xb - xa) * 16 / 32, rv = slope * 16 / 32;
  const pos = [], uv = [];
  const quad = (a, b, c, d, uvs) => { pos.push(...a, ...b, ...c, ...a, ...c, ...d); uv.push(...uvs[0], ...uvs[1], ...uvs[2], ...uvs[0], ...uvs[2], ...uvs[3]); };
  quad([xa, yE, zEF], [xb, yE, zEF], [xb, yR, zM], [xa, yR, zM], [[0, 0], [ru, 0], [ru, rv], [0, rv]]);
  quad([xb, yE, zEB], [xa, yE, zEB], [xa, yR, zM], [xb, yR, zM], [[0, 0], [ru, 0], [ru, rv], [0, rv]]);
  const rg = new THREE.BufferGeometry();
  rg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  rg.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  rg.computeVertexNormals();
  const roof = new THREE.Mesh(rg, new THREE.MeshLambertMaterial({ map: roofTex[style], side: THREE.DoubleSide }));

  scene.add(roof);
  const gp = [x0, H, zF, x0, H, zB, x0, yR, zM, x1, H, zB, x1, H, zF, x1, yR, zM];
  const gg = new THREE.BufferGeometry();

  gg.setAttribute("uv", new THREE.Float32BufferAttribute([0, 0, 1, 0, 0.5, 0.8, 0, 0, 1, 0, 0.5, 0.8], 2));

  const gable = new THREE.Mesh(gg, new THREE.MeshLambertMaterial({ map: side, side: THREE.DoubleSide }));

  const pl = new THREE.PointLight("#ffa850", 5, 4.5, 2);

}

const waterMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uSize: { value: new THREE.Vector2(5 * 16, 4 * 16) } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
  fragmentShader: `
    varying vec2 vUv; uniform float uTime; uniform vec2 uSize;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec2 p = floor(vUv * uSize);
      vec2 e = min(p, uSize - 1.0 - p);
      if (min(e.x, e.y) < 4.0) discard;
      float a = 0.0; vec3 col = vec3(0.85, 0.95, 1.0);
      float wave = sin(p.y * 0.55 + uTime * 1.6 + sin(p.x * 0.12 + uTime * 0.7) * 2.0);
      if (wave > 0.93 && mod(p.x + floor(uTime * 6.0), 5.0) < 3.0) a = 0.55;
      if (h(p + floor(uTime * 2.5)) > 0.992) a = 0.95;
      a += 0.12 * (0.5 + 0.5 * sin(uTime * 0.8 + p.x * 0.05));
      col = mix(vec3(1.0, 0.7, 0.45), col, a);
      gl_FragColor = vec4(col, a);
    }`,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(5, 4), waterMat);
water.rotation.x = -Math.PI / 2; water.position.set(13 + 2.5, 0.01, 24 + 2);
scene.add(water);

// kunang-kunang
const FLY = 40;
const flyPos = new Float32Array(FLY * 3), flySeed = new Float32Array(FLY);
for (let i = 0; i < FLY; i++) {
  flyPos[i * 3] = 1 + (hash(i, 1, 90) % 1800) / 100;
  flyPos[i * 3 + 1] = 0.3 + (hash(i, 2, 90) % 150) / 100;
  flyPos[i * 3 + 2] = 1 + (hash(i, 3, 90) % 3000) / 100;
  flySeed[i] = (hash(i, 4, 90) % 1000) / 100;
}
const flyGeo = new THREE.BufferGeometry();
flyGeo.setAttribute("position", new THREE.BufferAttribute(flyPos, 3));
flyGeo.setAttribute("seed", new THREE.BufferAttribute(flySeed, 1));
const flyMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uPx: { value: 1 } },
  vertexShader: `
    attribute float seed; uniform float uTime, uPx; varying float vA;
    void main(){
      vec3 p = position + vec3(sin(uTime * 0.6 + seed) * 0.6, sin(uTime * 0.9 + seed * 2.0) * 0.25, cos(uTime * 0.5 + seed) * 0.6);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      vA = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(uTime * 2.2 + seed * 5.0), 3.0);
      gl_PointSize = uPx * 1.5;
    }`,
  fragmentShader: "varying float vA; void main(){ gl_FragColor = vec4(vec3(0.85, 1.0, 0.45) * vA * 1.4, vA); }",
});
scene.add(new THREE.Points(flyGeo, flyMat));

// karakter: billboard dengan lembar sprite, bayangan kontak lembut di kaki
const contactTex = (() => {
  const cv = mk(32, 32), c = cv.getContext("2d");
  const g = c.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, "rgba(10,5,25,0.55)"); g.addColorStop(1, "rgba(10,5,25,0)");
  c.fillStyle = g; c.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(cv);
})();
const charGeo = billboardGeo(1, 1.5);
function makeActor(charKey) {
  const tex = pix(makeSheet(CHARS[charKey]));
  tex.repeat.set(1 / 12, 1);
  const mesh = new THREE.Mesh(charGeo, spriteMat(tex));
  mesh.castShadow = true;
  const blob = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.45), new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2;
  scene.add(mesh, blob);
  return { mesh, tex, blob };
}
const playerActor = makeActor("nino");
for (const n of NPCS) n.actor = makeActor(n.char);
function placeActor(a, x, z, dir, walk) {
  const f = walk > 0 ? [0, 1, 0, 2][Math.floor(walk * 8) % 4] : 0;
  a.tex.offset.x = (DIRS.indexOf(dir) * 3 + f) / 12;
  a.mesh.position.set(x, 0, z);
  a.blob.position.set(x, 0.02, z + 0.05);
}

// penanda tujuan tap
const markTex = (() => {
  const cv = mk(16, 16), c = cv.getContext("2d");
  R(c, "#ffe066", 1, 1, 14, 1); R(c, "#ffe066", 1, 14, 14, 1); R(c, "#ffe066", 1, 1, 1, 14); R(c, "#ffe066", 14, 1, 1, 14);
  R(c, "#fff6c0", 1, 1, 3, 1); R(c, "#fff6c0", 1, 1, 1, 3);
  return pix(cv);
})();
const marker = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: markTex, transparent: true, depthWrite: false }));
marker.rotation.x = -Math.PI / 2;
scene.add(marker);

// ================================================================ post-processing HD-2D
// Scene dirender ke tekstur bermipmap. Mipmap dipakai sebagai blur murah untuk tilt-shift dan bloom.
let rt = null;
const post = new THREE.ShaderMaterial({
  uniforms: { tScene: { value: null }, uFocus: { value: 0.5 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: `
    uniform sampler2D tScene; uniform float uFocus, uTime; uniform vec2 uRes; varying vec2 vUv;
    vec3 blurAt(vec2 uv, float lod){
      vec2 o = exp2(lod) / uRes * 0.75;
      return (textureLod(tScene, uv + vec2(o.x, o.y), lod).rgb + textureLod(tScene, uv + vec2(-o.x, o.y), lod).rgb
            + textureLod(tScene, uv + vec2(o.x, -o.y), lod).rgb + textureLod(tScene, uv - o, lod).rgb) * 0.25;
    }
    vec3 aces(vec3 x){ return clamp(x * (2.51 * x + 0.03) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
    void main(){
      vec2 uv = vUv;
      vec3 sharp = textureLod(tScene, uv, 0.0).rgb;
      float d = abs(uv.y - uFocus) - (uv.y > uFocus ? 0.18 : 0.20);
      float amt = smoothstep(0.0, 0.35, d);
      vec3 col = mix(sharp, blurAt(uv, amt * 2.2), smoothstep(0.0, 0.3, amt));
      vec3 b = textureLod(tScene, uv, 3.0).rgb * 0.45 + blurAt(uv, 4.5) * 0.35 + blurAt(uv, 6.0) * 0.3;
      col += max(b - vec3(0.5), 0.0) * vec3(1.7, 1.25, 0.9);
      float ray = pow(max(0.0, sin((uv.x * 1.2 - uv.y * 0.8) * 10.0 + uTime * 0.12)), 10.0);
      col += ray * smoothstep(0.55, 1.0, uv.y) * smoothstep(0.0, 0.5, uv.x) * vec3(0.05, 0.032, 0.018);
      col = aces(col * 1.45);
      col = toSRGB(col);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 1.12);
      col += vec3(0.035, 0.0, 0.06) * (1.0 - col);
      vec2 q = (uv - 0.5) * vec2(1.25, 0.95);
      col *= 1.0 - dot(q, q) * 0.85;
      col += (fract(sin(dot(uv * uRes + fract(uTime) * 91.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.025;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ================================================================ ukuran layar
// Area main selalu 9:16. Lapisan UI pixel art 180 x 320 di atasnya.
const view = { w: 360, h: 640, left: 0, top: 0 };
function fit() {
  const w = Math.floor(Math.min(innerWidth, innerHeight * 9 / 16)), h = Math.floor(w * 16 / 9);
  Object.assign(view, { w, h });
  const wrap = document.getElementById("wrap");
  wrap.style.width = w + "px"; wrap.style.height = h + "px";
  uiCanvas.style.width = w + "px"; uiCanvas.style.height = h + "px";
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(Math.floor(w * pr), Math.floor(h * pr),
    { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });
  post.uniforms.uRes.value.set(w * pr, h * pr);
  flyMat.uniforms.uPx.value = pr * Math.max(1, w / 180);   // satu piksel game
}
addEventListener("resize", fit);
fit();

function placeCamera() {
  camera.position.set(cam.x, DIST * Math.sin(PITCH), cam.z + DIST * Math.cos(PITCH));
  camera.lookAt(cam.x, 0, cam.z);
  camera.updateMatrixWorld();
  sun.position.set(cam.x - 14, 16, cam.z + 7);
  sun.target.position.set(cam.x, 0, cam.z - 2);
}

// ================================================================ render
function render(now) {
  const t = now / 1000;
  placeCamera();
  placeActor(playerActor, player.x / TS + 0.5, player.y / TS + 0.5, player.dir, player.walk);
  for (const n of NPCS) placeActor(n.actor, n.tx + 0.5, n.ty + 0.5, n.dir, 0);
  marker.visible = target.x >= 0;
  if (marker.visible) { marker.position.set(target.x + 0.5, 0.03, target.y + 0.5); marker.material.opacity = 0.55 + 0.45 * Math.sin(t * 8); }
  waterMat.uniforms.uTime.value = t; flyMat.uniforms.uTime.value = t;
  halos.forEach((hl, i) => { const s = 1.6 + Math.sin(t * 3 + i) * 0.08; hl.scale.set(s, s, 1); });
  const fp = new THREE.Vector3(player.x / TS + 0.5, 0.6, player.y / TS + 0.5).project(camera);
  post.uniforms.uFocus.value = fp.y * 0.5 + 0.5;
  post.uniforms.uTime.value = t;
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  post.uniforms.tScene.value = rt.texture;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
  ctx.clearRect(0, 0, VW, VH);
  if (dlg.npc) drawDialog(now);
}

function wrapText(text, maxW) {
  const out = [];
  let line = "";
  for (const w of text.split(" ")) {
    const t = line ? line + " " + w : w;
    if (line && textW(t) > maxW) { out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

function drawDialog(now) {
  const x = 4, y = 234, w = VW - 8, h = 82;
  ctx.globalAlpha = 0.94;
  R(ctx, "#0b0d24", x, y + 1, w, h - 2); R(ctx, "#0b0d24", x + 1, y, w - 2, h);   // panel biru gradasi, bingkai bertingkat
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#2d3a82"); g.addColorStop(1, "#171c52");
  ctx.fillStyle = g; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.globalAlpha = 1;
  R(ctx, "#b8c2ff", x + 2, y + 2, w - 4, 1); R(ctx, "#b8c2ff", x + 2, y + 2, 1, h - 4);
  R(ctx, "#6c78d4", x + 3, y + h - 3, w - 5, 1); R(ctx, "#6c78d4", x + w - 3, y + 3, 1, h - 5);
  const nw = textW(dlg.npc.name) + 10;                                            // kartu nama
  R(ctx, "#0b0d24", x + 6, y - 8, nw, 12);
  R(ctx, "#f4cf5a", x + 7, y - 7, nw - 2, 10); R(ctx, "#fff1b0", x + 7, y - 7, nw - 2, 1);
  drawText(ctx, dlg.npc.name, x + 12, y - 5, "#3a2a14");
  const text = dlg.npc.lines[dlg.line];
  let start = 0;
  wrapText(text, w - 18).forEach((ln, i) => {
    const part = ln.slice(0, Math.max(0, Math.floor(dlg.shown) - start));
    drawText(ctx, part, x + 9, y + 10 + i * 10, "#f4f4ff", "#0b0d24");
    start += ln.length + 1;
  });
  if (dlg.shown >= text.length && Math.floor(now / 400) % 2 === 0) {
    const ax = x + w - 14, ay = y + h - 11;
    R(ctx, "#f4cf5a", ax, ay, 7, 1); R(ctx, "#f4cf5a", ax + 1, ay + 1, 5, 1);
    R(ctx, "#f4cf5a", ax + 2, ay + 2, 3, 1); R(ctx, "#f4cf5a", ax + 3, ay + 3, 1, 1);
  }
}

// ================================================================ input
// Tap: sinar dari kamera. Kena NPC berarti ajak bicara, selain itu tile di tanah jadi tujuan.
const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
glCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (dlg.npc) { advanceDialog(); return; }
  const r = glCanvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  placeCamera();
  ray.setFromCamera(ndc, camera);
  const hitNpc = ray.intersectObjects(NPCS.map((n) => n.actor.mesh))[0];
  let tx, ty;
  if (hitNpc) { const n = NPCS.find((q) => q.actor.mesh === hitNpc.object); tx = n.tx; ty = n.ty; }
  else {
    const p = ray.ray.intersectPlane(groundPlane, new THREE.Vector3());
    if (!p) return;
    tx = Math.floor(p.x); ty = Math.floor(p.z);
  }
  const npc = npcAt(tx, ty);
  if (npc) {
    if (adjacent(npc)) { player.path = []; openDialog(npc); return; }
    const spots = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dx, dy]) => findPath(player.tx, player.ty, tx + dx, ty + dy))
      .filter(Boolean)
      .sort((a, b) => a.length - b.length);
    if (!spots.length) return;
    player.path = spots[0]; pending = npc;
    const end = spots[0][spots[0].length - 1];
    target.x = end[0]; target.y = end[1];
    return;
  }
  const path = findPath(player.tx, player.ty, tx, ty);
  if (!path) return;
  pending = null;
  player.path = path;
  target.x = tx; target.y = ty;
});
glCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  updateCamera();
  render(now);
  requestAnimationFrame(frame);
}
updateCamera();
requestAnimationFrame(frame);

// Dipakai untuk uji otomatis: posisi layar (piksel CSS) dari tengah tile di tanah
function tileToScreen(tx, ty) {
  placeCamera();
  const p = new THREE.Vector3(tx + 0.5, 0, ty + 0.5).project(camera);
  const r = glCanvas.getBoundingClientRect();
  return { x: r.left + (p.x * 0.5 + 0.5) * r.width, y: r.top + (-p.y * 0.5 + 0.5) * r.height, left: r.left, top: r.top, w: r.width, h: r.height };
}
window.__recursio = { VW, VH, TS, MW, MH, map, player, cam, target, dlg, NPCS, CHARS, CAM_BOUNDS, tileToScreen };
</script>
