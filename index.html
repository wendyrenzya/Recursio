<!DOCTYPE html>

          font-family: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600; font-size: calc(var(--w, 360px) * 0.043); }
  #gl { position: absolute; left: 0; top: 0; display: block; touch-action: none; }
  /* kotak dialog: panel biru tembus pandang bersudut bulat, kartu nama emas, panah lanjut */
  #dlg { display: none; position: absolute; left: 3.5%; right: 3.5%; bottom: 3%; min-height: 22%; box-sizing: border-box;
         padding: 1.5em 1.2em 1.2em; border-radius: 0.9em; color: #f4f4ff; line-height: 1.5; pointer-events: none;
         background: linear-gradient(180deg, rgba(38, 46, 98, 0.9), rgba(18, 20, 52, 0.93));

  #dlgName { position: absolute; top: -0.9em; left: 1em; padding: 0.2em 0.95em; border-radius: 99px; font-weight: 800; font-size: 0.92em;

<script type="module">
import * as THREE from "./lib/three.module.min.js";
import { loadChar } from "./chars3d.js";
import { GLTFLoader } from "./lib/GLTFLoader.js";
import { openBattle } from "./battle/ui.mjs";
import { muat, simpan, partyBattle, selesaiBattle, istirahat, ubahKesadaran, beriItem } from "./game/progress.mjs";
import { BAB1 } from "./game/bab1.mjs";
import { DATA } from "./battle/data.mjs";
import { createHud } from "./game/tas.mjs";

// ================================================================ dasar
// Logika memakai satuan piksel tile 16. Dunia 3D memakai 1 unit = 1 tile.
const TS = 16, SPEED = 64;
const GRASS = 0, ROAD = 1, HOUSE = 2, TREE = 3, WATER = 4, FOREST = 5, PALM = 6, LAMP = 7, FIELD = 8;   // tipe > 1 menghalangi jalan

const hash = (x, y, s = 0) => {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1274126177)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
};
const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

// ================================================================ peta
const MW = 20, MH = 32, M = 8;   // M: lebar hutan di luar peta, hanya untuk pemandangan
const map = Array.from({ length: MH }, () => new Array(MW).fill(GRASS));
const fill = (x, y, w, h, t) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) map[j][i] = t; };
fill(0, 0, MW, 1, FOREST); fill(0, MH - 1, MW, 1, FOREST);   // pepohonan di pinggir peta
fill(0, 0, 1, MH, FOREST); fill(MW - 1, 0, 1, MH, FOREST);
fill(9, 1, 2, MH - 2, ROAD);                                  // jalan utama
fill(1, 20, 18, 2, ROAD);                                     // jalan melintang
fill(3, 4, 4, 3, HOUSE);  fill(4, 7, 6, 1, ROAD);             // rumah Nino dan jalannya
fill(13, 4, 4, 3, HOUSE); fill(10, 7, 6, 1, ROAD);            // rumah Kael dan jalannya
fill(13, 24, 5, 4, WATER);                                    // kolam
fill(3, 10, 4, 2, FIELD);                                     // kebun sayur Alisa
const put = (t, pts) => pts.forEach(([x, y]) => { map[y][x] = t; });
put(TREE, [[2, 13], [3, 15], [15, 12], [17, 14], [16, 17], [2, 17], [6, 28], [17, 19]]);
put(PALM, [[7, 11], [13, 11], [1, 24], [4, 25], [12, 29], [18, 23], [7, 16], [14, 17], [2, 28]]);
put(LAMP, [[8, 6], [11, 19], [8, 22]]);
const tileAt = (x, y) => (x >= 0 && y >= 0 && x < MW && y < MH ? map[y][x] : FOREST);

const baseWalkable = (x, y) =>
  x >= 0 && y >= 0 && x < MW && y < MH && (map[y][x] === GRASS || map[y][x] === ROAD);

// ================================================================ tanah halus (digambar sekali)
// 32 piksel per tile. Tiap jenis tanah dilukis sebagai lapisan, lalu dipotong dengan mask yang tepinya dikaburkan.
const GP = 32, GW = (MW + 2 * M) * GP, GH = (MH + 2 * M) * GP;
const isRoadLike = (x, y) => { const t = tileAt(x, y); return t === ROAD || t === HOUSE; };
const rgba = ([r, g, b], a) => `rgba(${r},${g},${b},${a})`;
function softMask(test, blur) {
  const a = mk(GW, GH), c = a.getContext("2d");
  c.fillStyle = "#fff";
  for (let ty = -M; ty < MH + M; ty++) for (let tx = -M; tx < MW + M; tx++) if (test(tx, ty)) c.fillRect((tx + M) * GP, (ty + M) * GP, GP, GP);
  const b = mk(GW, GH), d = b.getContext("2d");
  d.filter = `blur(${blur}px)`; d.drawImage(a, 0, 0);
  return b;
}
// lapisan: warna dasar, bercak lembut besar [rgb, alfa], lalu bintik halus
function paintLayer(base, blobs, specks, seed) {
  const cv = mk(GW, GH), c = cv.getContext("2d");
  c.fillStyle = base; c.fillRect(0, 0, GW, GH);
  for (let i = 0; i < GW * GH / 9000; i++) {
    const x = hash(i, 1, seed) % GW, y = hash(i, 2, seed) % GH, r = 30 + hash(i, 3, seed) % 90, [col, a] = blobs[hash(i, 4, seed) % blobs.length];
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (let i = 0; specks.length && i < GW * GH / 60; i++) {
    c.fillStyle = specks[hash(i, 5, seed) % specks.length];
    c.fillRect(hash(i, 6, seed) % GW, hash(i, 7, seed) % GH, 2, 2);
  }
  return cv;
}
function stamp(dst, layer, mask, alpha = 1) {       // tempel lapisan hanya di area mask
  const c = layer.getContext("2d");
  c.globalCompositeOperation = "destination-in"; c.drawImage(mask, 0, 0);
  dst.globalAlpha = alpha; dst.drawImage(layer, 0, 0); dst.globalAlpha = 1;
}
// lapisan di atas rumput: bayang gelap di hutan pinggir, bahu jalan semen, dan aspal; selebihnya transparan
function buildGround() {
  const cv = mk(GW, GH), c = cv.getContext("2d");
  stamp(c, paintLayer("#1f4a28", [[[30, 70, 35], 0.5]], [], 2), softMask((x, y) => tileAt(x, y) === FOREST, 16), 0.55);
  stamp(c, paintLayer("#b8b4ac", [[[205, 200, 190], 0.4]], ["rgba(140,136,128,0.5)"], 7), softMask(isRoadLike, 5));   // bahu jalan semen
  stamp(c, paintLayer("#5a5d64", [[[80, 84, 92], 0.4], [[60, 62, 68], 0.4]], ["rgba(40,42,48,0.5)", "rgba(130,134,140,0.4)"], 4), softMask(isRoadLike, 1));   // aspal
  return cv;
}

// ================================================================ tekstur atap genteng beton (256 piksel = 2 tile), satu warna untuk semua rumah
function roofCanvas() {
  const S = 256, cv = mk(S, S), c = cv.getContext("2d");
  c.fillStyle = "#3e4652"; c.fillRect(0, 0, S, S);
  for (let row = 0; row < 8; row++) for (let i = -1; i < 9; i++) {
    const x = i * 32 + (row % 2) * 16, y = row * 32;
    const g = c.createLinearGradient(0, y, 0, y + 32);
    g.addColorStop(0, "#56606e"); g.addColorStop(0.7, "#6a7482"); g.addColorStop(1, "#4a535f");
    c.fillStyle = g; c.fillRect(x + 1, y + 1, 30, 30);
    c.fillStyle = "rgba(255,255,255,0.08)"; c.fillRect(x + 1, y + 1, 30, 3);
  }
  return cv;
}

// ================================================================ keadaan permainan
const NPCS = [   // dialog diambil dari cerita (game/bab1.mjs) saat diajak bicara
  { name: "Alisa", id: "alisa", tx: 6, ty: 8, char: "alisa", dir: "down", lines: [] },
  { name: "Rin", id: "rin", tx: 12, ty: 8, char: "rin", dir: "down", lines: [] },
];
const npcAt = (x, y) => NPCS.find((n) => n.tx === x && n.ty === y);
const walkable = (x, y) => baseWalkable(x, y) && !npcAt(x, y);

const player = { tx: 9, ty: 3, x: 9 * TS, y: 3 * TS, path: [], dir: "down", walk: 0, yaw: 0 };
const save = muat();                              // progres tersimpan di perangkat
if (walkable(save.pos.tx, save.pos.ty)) Object.assign(player, { tx: save.pos.tx, ty: save.pos.ty, x: save.pos.tx * TS, y: save.pos.ty * TS });
let hud = null, menuOpen = false;
const trail = [];                                 // jejak posisi Nino, diikuti Kael
const DIR_YAW = { down: 0, up: Math.PI, left: -Math.PI / 2, right: Math.PI / 2 };   // arah hadap model 3D
const target = { x: -1, y: -1 };
const cam = { x: 0, z: 0 };                      // titik fokus kamera dalam satuan tile
const dlg = { npc: null, line: 0, shown: 0 };   // npc null berarti dialog tertutup
let pending = null;                              // NPC yang akan diajak bicara setelah sampai
const CPS = 40;                                  // karakter per detik

const adjacent = (n) => Math.abs(n.tx - player.tx) + Math.abs(n.ty - player.ty) === 1;
const atRest = () => player.x === player.tx * TS && player.y === player.ty * TS && player.path.length === 0;
const dirTo = (dx, dy) => (Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
// ---------------------------------------------------------------- cerita Bab 1
const cerita = save.cerita;
const adaKael = () => cerita.langkah >= 3;
const anomaliAktif = (a) => !save.flags[a.id] && cerita.langkah === (a.bos ? 4 : 3);
function tujuan() {
  const teks = BAB1.tujuan[cerita.langkah] || "";
  return cerita.langkah === 3 ? `${teks} (${BAB1.anomali.filter((a) => save.flags[a.id]).length}/${BAB1.anomali.length})` : teks;
}
function majuCerita(langkah, pesan) {
  cerita.langkah = langkah; simpan(save); hud.refresh();
  if (pesan) hud.toast(pesan);
}
// baris "Nama|teks": nama pembicara di depan, kosong berarti narasi, tanpa "|" berarti NPC yang diajak bicara
function dlgLine() {
  const raw = dlg.npc.lines[dlg.line], i = raw.indexOf("|");
  return i < 0 ? { n: dlg.npc.name, t: raw } : { n: raw.slice(0, i), t: raw.slice(i + 1) };
}
// adegan tanpa NPC (narasi, percakapan Nino dan Kael)
function openScript(lines, onEnd) {
  player.path = []; pending = null; target.x = -1;
  dlg.npc = { name: "", lines, script: true, onEnd }; dlg.line = 0; dlg.shown = 0;
}
function selesaiBicara(n) {
  if (n.script) return n.onEnd?.();
  const beri = (ids) => { ids.forEach((id) => beriItem(save, id)); return "Dapat " + ids.map((id) => DATA.equip[id].nama).join(" dan ") + " | buka Tas"; };
  if (n.id === "alisa" && cerita.langkah === 1) return majuCerita(2, beri(BAB1.hadiah.alisa));
  if (n.id === "rin" && cerita.langkah === 2) { const pesan = beri(BAB1.hadiah.rin); kaelGabung(); return majuCerita(3, pesan); }
  if (n.id === "alisa" && cerita.langkah >= 2) { istirahat(save); simpan(save); hud.refresh(); hud.toast("Istirahat di rumah | HP dan kesadaran pulih"); }
}

function openDialog(n) {
  n.lines = BAB1[n.id][cerita.langkah] || BAB1[n.id].lain;
  dlg.npc = n; dlg.line = 0; dlg.shown = 0;
  n.dir = dirTo(player.tx - n.tx, player.ty - n.ty);
  player.dir = dirTo(n.tx - player.tx, n.ty - player.ty);
  player.yaw = DIR_YAW[player.dir];
  pending = null; target.x = -1;
}
function advanceDialog() {
  const text = dlgLine().t;
  if (dlg.shown < text.length) { dlg.shown = text.length; return; }
  if (++dlg.line >= dlg.npc.lines.length) {
    const n = dlg.npc;
    n.dir = "down"; dlg.npc = null;
    selesaiBicara(n);
    return;
  }
  dlg.shown = 0;
}

// Cari jalur terpendek 4 arah (BFS), null jika tidak bisa dicapai
function findPath(sx, sy, ex, ey) {
  if (!walkable(ex, ey)) return null;
  const key = (x, y) => y * MW + x;
  const prev = new Map([[key(sx, sy), null]]);
  const queue = [[sx, sy]];
  for (let i = 0; i < queue.length; i++) {
    const [x, y] = queue[i];
    if (x === ex && y === ey) break;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!walkable(nx, ny) || prev.has(key(nx, ny))) continue;
      prev.set(key(nx, ny), [x, y]);
      queue.push([nx, ny]);
    }
  }
  if (!prev.has(key(ex, ey))) return null;
  const path = [];
  for (let c = [ex, ey]; c; c = prev.get(key(c[0], c[1]))) path.push([c[0] * TS, c[1] * TS]);
  return smooth(path.reverse());
}

// Garis bebas hambatan: badan Nino (setengah lebar 5 piksel) tidak menyentuh tile terhalang di sepanjang garis
function clearLine(ax, ay, bx, by) {
  const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 3));
  for (let i = 0; i <= n; i++) {
    const x = ax + (bx - ax) * i / n + 8, y = ay + (by - ay) * i / n + 8;
    for (const [ox, oy] of [[-5, -5], [5, -5], [-5, 5], [5, 5]])
      if (!walkable(Math.floor((x + ox) / TS), Math.floor((y + oy) / TS))) return false;
  }
  return true;
}
// Buang titik belok yang tidak perlu, supaya Nino berjalan lurus ke tujuan dan hanya berbelok di penghalang
function smooth(pts) {
  const out = [];
  let cx = player.x, cy = player.y, i = 0;
  while (i < pts.length) {
    let j = pts.length - 1;
    while (j > i && !clearLine(cx, cy, pts[j][0], pts[j][1])) j--;
    out.push(pts[j]); [cx, cy] = pts[j]; i = j + 1;
  }
  return out;
}
const pathLen = (pts) => pts.reduce((acc, q, i) => acc + Math.hypot(q[0] - (i ? pts[i - 1][0] : player.x), q[1] - (i ? pts[i - 1][1] : player.y)), 0);
// Arah hadap mengikuti arah gerak. Di sekitar diagonal arah lama dipertahankan agar tidak berkedip.
function faceTo(dx, dy) {
  const horiz = dx < 0 ? "left" : "right", vert = dy < 0 ? "up" : "down";
  if (Math.abs(dx) > Math.abs(dy) * 1.3) player.dir = horiz;
  else if (Math.abs(dy) > Math.abs(dx) * 1.3) player.dir = vert;
  else if (player.dir !== horiz && player.dir !== vert) player.dir = vert;
}

let battle = null;                               // Promise battle yang sedang berjalan
function startBattle(a) {
  player.path = []; pending = null; target.x = -1; player.walk = 0;
  hud.el.style.display = "none"; dlgEl.style.display = "none";
  battle = openBattle(document.getElementById("wrap"), {
    bab: 1, musuh: a.musuh, party: partyBattle(save), items: { ...save.item },
    hasil: (s) => {
      const naik = selesaiBattle(save, s);
      if (s.over === "menang") save.flags[a.id] = true;
      simpan(save);
      return naik;
    },
  });
  battle.then((r) => {
    a.armed = false; battle = null;
    hud.el.style.display = ""; hud.refresh();
    if (r !== "menang") return;
    if (a.bos) openScript(BAB1.penutup, () => majuCerita(5, "Bab 1 selesai"));
    else if (BAB1.anomali.every((x) => save.flags[x.id])) openScript(BAB1.setelahAnomali, () => majuCerita(4));
  });
}
// Mendekati anomali: adegan pengantar sekali saja, lalu battle.
function temuAnomali(a) {
  const adegan = a.bos ? "sebelumBos" : "sebelumBattle";
  if (save.flags[adegan]) return startBattle(a);
  save.flags[adegan] = true;
  openScript(BAB1[adegan], () => startBattle(a));
}

function update(dt) {
  if (battle || menuOpen) { player.walk = 0; return; }
  if (dlg.npc) {
    dlg.shown = Math.min(dlgLine().t.length, dlg.shown + CPS * dt);
    player.walk = 0;
    return;
  }
  // sisa jarak dipakai untuk melambat saat hampir tiba, moveT untuk percepatan saat mulai
  let rem = 0, px = player.x, py = player.y;
  for (const [x, y] of player.path) { rem += Math.hypot(x - px, y - py); px = x; py = y; }
  player.moveT = rem > 0 ? (player.moveT || 0) + dt : 0;
  let move = SPEED * dt * Math.min(1, 0.35 + player.moveT / 0.18) * Math.min(1, 0.45 + rem / 10);
  let moved = false;
  const x0 = player.x, y0 = player.y;
  while (move > 0 && player.path.length) {
    const [gx, gy] = player.path[0];
    const dx = gx - player.x, dy = gy - player.y, dist = Math.hypot(dx, dy);
    if (dist < 1e-6) { player.path.shift(); continue; }
    faceTo(dx, dy);
    player.yaw = Math.atan2(dx, dy);
    moved = true;
    if (move >= dist) {
      player.x = gx; player.y = gy; move -= dist; player.walk += dist; player.path.shift();
    } else {
      player.x += dx / dist * move; player.y += dy / dist * move; player.walk += move; move = 0;
    }
  }
  player.tx = Math.round(player.x / TS); player.ty = Math.round(player.y / TS);
  if (!player.path.length) target.x = -1;
  if (!moved) player.walk = 0;                       // walk: jarak tempuh dalam piksel, menggerakkan siklus langkah
  if (pending && atRest()) { if (adjacent(pending)) openDialog(pending); else pending = null; }
  if (moved) {                                       // jejak langkah untuk Kael yang mengikuti
    trail.push([player.x, player.y]);
    if (trail.length > 400) trail.splice(0, 200);
  }
  if (moved && !player.path.length) { save.pos = { tx: player.tx, ty: player.ty }; simpan(save); }
  for (const a of anomalies) {
    if (!anomaliAktif(a)) continue;
    const da = Math.hypot(player.x / TS - a.tx, player.y / TS - a.ty);
    // zona EM sedang di sekitar anomali: kesadaran Kael turun 1 tiap 5 langkah
    if (moved && da < 4) {
      emLangkah += Math.hypot(player.x - x0, player.y - y0) / TS;
      while (emLangkah >= 5) { emLangkah -= 5; ubahKesadaran(save, -1); hud.refresh(); }
    }
    if (da > 2) a.armed = true;                      // setelah kabur atau kalah, harus menjauh dulu
    if (a.armed && da < 1.1) { temuAnomali(a); break; }
  }
}

// Fokus kamera mengikuti Nino, dibatasi agar tetap di dalam peta
const CAM_BOUNDS = { x0: 5.5, x1: MW - 5.5, z0: 8, z1: MH - 4.5 };
function updateCamera() {
  const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
  cam.x = clamp(player.x / TS + 0.5, CAM_BOUNDS.x0, CAM_BOUNDS.x1);
  cam.z = clamp(player.y / TS + 0.5, CAM_BOUNDS.z0, CAM_BOUNDS.z1);
}

// ================================================================ dunia 3D
const glCanvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color("#2c2240");
scene.fog = new THREE.Fog("#5a3f62", 58, 90);

const PITCH = THREE.MathUtils.degToRad(44), DIST = 55, FOV = 22;
const camera = new THREE.PerspectiveCamera(FOV, 9 / 16, 1, 200);

const smoothTex = (cv, repeat) => {                // tekstur halus dengan mipmap dan anisotropi
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
};

// cahaya senja: matahari rendah dari kiri, langit ungu, pantulan tanah hangat
const sun = new THREE.DirectionalLight("#ffbe80", 3.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 22, bottom: -22, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.radius = 3;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight("#a596e0", "#6e5238", 1.7));

// gambar hasil generate (assets/gen): tumbuhan, kolam, kebun, rumput. Semua dimuat bersamaan dan ditunggu sebelum permainan mulai.
const texLoader = new THREE.TextureLoader(), dummy = new THREE.Object3D();
async function genTex(name) {
  const t = await texLoader.loadAsync(`./assets/gen/${name}.webp`);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// tumbuhan: bidang tegak dimiringkan ke arah kamera, berdiri di titik dasarnya. Daftar [x, z, skala, balik kiri-kanan].
const TILT = PITCH - THREE.MathUtils.degToRad(12);
async function sprites(name, height, groups) {
  const t = await genTex(name), w = height * t.image.width / t.image.height;
  const geo = new THREE.PlaneGeometry(w, height); geo.translate(0, height / 2, 0); geo.rotateX(-TILT);
  const n = geo.attributes.normal;                   // normal menghadap ke atas: disinari seperti tanah, bukan gelap terkena cahaya samping
  for (let i = 0; i < n.count; i++) n.setXYZ(i, 0, 0.94, 0.34);
  const geoFlip = geo.clone(), uv = geoFlip.attributes.uv;   // versi cermin: gambar dibalik lewat uv, bukan skala negatif yang membalik arah permukaan
  for (let i = 0; i < uv.count; i++) uv.setX(i, 1 - uv.getX(i));
  const m = new THREE.MeshLambertMaterial({ map: t, alphaTest: 0.5, side: THREE.DoubleSide });
  for (const [list, shadow] of groups) for (const [g, side] of [[geo, 1], [geoFlip, -1]]) {
    const part = list.filter((q) => (q[3] ?? 1) === side);
    if (!part.length) continue;
    const inst = new THREE.InstancedMesh(g, m, part.length);
    part.forEach(([x, z, s = 1], i) => {
      dummy.position.set(x, 0, z); dummy.rotation.set(0, 0, 0); dummy.scale.setScalar(s); dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    });
    inst.castShadow = shadow;
    scene.add(inst);
  }
}

// lampu jalan: model Quaternius (CC0, models/world). Tiap potongan model jadi satu InstancedMesh agar banyak salinan tetap ringan.
const gltfLoader = new GLTFLoader();
// palette: nama bahan -> warna, diawali "*" berarti menyala. groups: [[daftar [x, z, skala, putaran], beri bayangan], ...]
async function scatter(file, height, palette, groups) {
  const src = (await gltfLoader.loadAsync(`./models/world/${file}.glb`)).scene;
  src.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(src), k = height / (box.max.y - box.min.y);
  const base = new THREE.Matrix4().makeScale(k, k, k)
    .multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
  src.traverse((o) => {
    if (!o.isMesh) return;
    const geo = o.geometry.clone().applyMatrix4(new THREE.Matrix4().multiplyMatrices(base, o.matrixWorld));
    const col = palette[o.material.name] || "#888888", glow = col[0] === "*", c = glow ? col.slice(1) : col;
    const m = new THREE.MeshStandardMaterial({ color: c, roughness: 0.9, metalness: 0, ...(glow ? { emissive: c, emissiveIntensity: 2.2 } : {}) });
    for (const [list, shadow] of groups) {
      if (!list.length) continue;
      const inst = new THREE.InstancedMesh(geo, m, list.length);
      list.forEach(([x, z, s = 1, r = 0], i) => {
        dummy.position.set(x, 0, z); dummy.rotation.set(0, r, 0); dummy.scale.setScalar(s); dummy.updateMatrix();
        inst.setMatrixAt(i, dummy.matrix);
      });
      inst.castShadow = shadow; inst.receiveShadow = true;
      scene.add(inst);
    }
  });
}
// sebar tanaman: pohon dan palem di tile-nya, hutan di pinggir, semak di tepi hutan dalam peta, bunga kecil di rumput.
// tree_3 (trembesi) sangat lebar, jadi hanya di hutan pinggir.
const W3 = { tree: [[], [], []], treeOut: [[], [], []], palm: [[], []], palmOut: [[], []], bush: [[], []], flower: [], lamp: [] };
for (let ty = -M; ty < MH + M; ty++) for (let tx = -M; tx < MW + M; tx++) {
  const t = tileAt(tx, ty), h = hash(tx, ty, 77), f = (h >>> 20) % 2 ? 1 : -1, inMap = tx >= 0 && ty >= 0 && tx < MW && ty < MH;
  if (t === TREE) W3.tree[h % 2].push([tx + 0.5, ty + 0.6, 1, f]);
  else if (t === PALM) W3.palm[h % 2].push([tx + 0.5, ty + 0.6, 1, f]);
  else if (t === LAMP) W3.lamp.push([tx + 0.5, ty + 0.55, 1, 0]);
  else if (t === FOREST) {
    const jx = ((h >>> 4) % 100) / 100 - 0.5, jz = ((h >>> 11) % 100) / 100 - 0.5, s = 0.9 + ((h >>> 15) % 40) / 100;
    const p = [tx + 0.5 + jx * 0.6, ty + 0.5 + jz * 0.6, s, f];
    if (ty >= MH - 1) { if (h % 10 < 3) W3.bush[(h >>> 5) % 2].push([p[0], p[1], 0.8 + s * 0.3, f]); }   // tepi selatan dekat kamera: semak rendah agar pandangan tidak tertutup
    else if (h % 10 < 6) {
      if ((h >>> 3) % 10 < 8) (inMap ? W3.tree : W3.treeOut)[(h >>> 6) % 3].push(p);
      else (inMap ? W3.palm : W3.palmOut)[(h >>> 7) % 2].push(p);
    } else if (inMap) W3.bush[(h >>> 5) % 2].push([p[0], p[1], 0.8 + s * 0.3, f]);
  } else if (t === GRASS && h % 100 < 4) W3.flower.push([tx + 0.2 + (h >>> 12) % 60 / 100, ty + 0.2 + (h >>> 18) % 60 / 100, 0.8 + (h >>> 9) % 40 / 100, f]);
}

// material flat shading, disimpan per warna agar tidak berulang
const matCache = {};
function mat(color, extra) {
  const key = color + (extra ? JSON.stringify(extra) : "");
  if (!matCache[key]) matCache[key] = new THREE.MeshLambertMaterial({ color, flatShading: true, ...(extra || {}) });
  return matCache[key];
}
function add(parent, geo, color, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, extra) {
  const m = new THREE.Mesh(geo, mat(color, extra));
  m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}
const box = (p, w, h, d, col, x, y, z, rx, ry, rz, extra) => add(p, new THREE.BoxGeometry(w, h, d), col, x, y, z, rx, ry, rz, extra);
const cyl = (p, rt, rb, h, seg, col, x, y, z, rx, ry, rz) => add(p, new THREE.CylinderGeometry(rt, rb, h, seg), col, x, y, z, rx, ry, rz);
const ball = (p, r, col, x, y, z, sx = 1, sy = 1, sz = 1, detail = 1) => { const m = add(p, new THREE.IcosahedronGeometry(r, detail), col, x, y, z); m.scale.set(sx, sy, sz); return m; };

const plasterTex = (() => {                          // plester: bintik halus, warnanya dari warna bahan
  const cv = mk(128, 128), c = cv.getContext("2d");
  c.fillStyle = "#f2f2f2"; c.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1400; i++) {
    c.fillStyle = hash(i, 1, 51) % 2 ? "rgba(0,0,0,0.05)" : "rgba(255,255,255,0.7)";
    c.fillRect(hash(i, 2, 51) % 128, hash(i, 3, 51) % 128, 2, 2);
  }
  return smoothTex(cv, true);
})();
const roofMat = new THREE.MeshLambertMaterial({ map: smoothTex(roofCanvas(), true), side: THREE.DoubleSide });
function hipRoof(w, d, h) {                          // atap limas: trapesium depan dan belakang, segitiga di samping
  const x = w / 2, z = d / 2, r = (w - d) / 2;
  const A = [-x, 0, z], B = [x, 0, z], C2 = [x, 0, -z], D = [-x, 0, -z], E = [-r, h, 0], F = [r, h, 0];
  const pos = [], uv = [];
  const face = (pts, ax) => pts.forEach((q) => { pos.push(...q); uv.push(q[ax] * 0.5, q[1] * 0.75); });
  face([A, B, F, A, F, E], 0); face([C2, D, E, C2, E, F], 0); face([D, A, E], 2); face([B, C2, F], 2);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geo.computeVertexNormals();
  return geo;
}
function windowAt(g, x, y, z, w, h, curtain) {       // bingkai aluminium, kaca bercahaya hangat, tirai separuh
  box(g, w + 0.1, h + 0.1, 0.06, "#2e3238", x, y, z);
  box(g, w, h, 0.04, "#ffd99a", x, y, z + 0.02, 0, 0, 0, { emissive: "#ffb860", emissiveIntensity: 1.3 });
  box(g, 0.04, h, 0.03, "#2e3238", x, y, z + 0.05);
  box(g, w * 0.4, h * 0.85, 0.02, curtain, x - w * 0.27, y + h * 0.05, z + 0.04);
  box(g, w + 0.2, 0.06, 0.14, "#e8e4dc", x, y - h / 2 - 0.08, z + 0.05);   // ambang jendela
}
function buildHouse(tx, tz, st) {
  const g = new THREE.Group();
  g.position.set(tx + 2, 0, tz + 1.5);               // tengah tapak 4 x 3
  scene.add(g);
  const B0 = 0.22, H = 2.6, Y0 = B0;                 // lantai ditinggikan, tinggi dinding
  const wallMat = new THREE.MeshLambertMaterial({ color: st.wall, map: plasterTex });
  const accentMat = new THREE.MeshLambertMaterial({ color: st.accent, map: plasterTex });
  box(g, 3.9, B0, 2.9, "#b4aea4", 0, B0 / 2, 0);     // pondasi beton
  box(g, 2.15, 0.02, 0.85, "#ece6da", 0.78, B0 + 0.01, 1.03);   // lantai teras keramik
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.7, H, 2.0), wallMat);
  body.position.set(0, Y0 + H / 2, -0.4); g.add(body);
  const room = new THREE.Mesh(new THREE.BoxGeometry(1.55, H, 0.85), accentMat);   // kamar depan menjorok, warna aksen
  room.position.set(-1.07, Y0 + H / 2, 1.0); g.add(room);
  for (let k = 0; k < 5; k++) box(g, 0.08, H - 0.2, 0.04, st.wall, -1.6 + k * 0.1, Y0 + H / 2, 1.44);   // garis vertikal dekoratif
  windowAt(g, -0.95, Y0 + 1.35, 1.43, 0.85, 1.0, st.curtain);
  // pintu kayu dan jendela samping pintu
  box(g, 0.86, 2.0, 0.06, "#2e3238", 0.45, Y0 + 1.0, 0.61);
  box(g, 0.76, 1.92, 0.05, st.door, 0.45, Y0 + 0.96, 0.63);
  for (let k = 0; k < 4; k++) box(g, 0.6, 0.02, 0.02, "#4a3020", 0.45, Y0 + 0.5 + k * 0.4, 0.665);
  box(g, 0.04, 0.2, 0.05, "#d8d8d8", 0.72, Y0 + 1.0, 0.68);
  windowAt(g, 1.4, Y0 + 1.35, 0.61, 0.7, 0.9, st.curtain);
  // tiang teras dan balok
  for (const x of [-0.25, 1.8]) box(g, 0.16, H, 0.16, "#f2efe8", x, Y0 + H / 2, 1.35);
  box(g, 2.25, 0.18, 0.16, "#f2efe8", 0.78, Y0 + H - 0.09, 1.35);
  // atap limas satu warna dan lisplang putih
  const RY = Y0 + H;
  const roof = new THREE.Mesh(hipRoof(4.5, 3.25, 1.1), roofMat);
  roof.position.set(0, RY, 0.0); g.add(roof);
  box(g, 4.52, 0.12, 0.06, "#f2efe8", 0, RY - 0.03, 1.63); box(g, 4.52, 0.12, 0.06, "#f2efe8", 0, RY - 0.03, -1.63);
  box(g, 0.06, 0.12, 3.28, "#f2efe8", 2.26, RY - 0.03, 0); box(g, 0.06, 0.12, 3.28, "#f2efe8", -2.26, RY - 0.03, 0);
  box(g, 3.9, 0.06, 2.95, "#e8e4dc", 0, RY - 0.06, 0);   // plafon teras
  // unit AC di dinding samping, nomor rumah, lampu teras
  box(g, 0.55, 0.42, 0.25, "#e6e6ea", 1.98, Y0 + 0.6, -0.6);
  cyl(g, 0.14, 0.14, 0.02, 14, "#9a9aa4", 2.11, Y0 + 0.6, -0.6, 0, 0, Math.PI / 2);
  box(g, 0.24, 0.16, 0.02, "#2e3238", -0.1, Y0 + 1.95, 0.62);
  box(g, 0.12, 0.16, 0.12, "#ffe48a", 0.45, Y0 + 2.25, 0.68, 0, 0, 0, { emissive: "#ffcc55", emissiveIntensity: 2.5 });
  const pl = new THREE.PointLight("#ffa850", 5, 4.5, 2); pl.position.set(0.45, Y0 + 2.1, 1.1); g.add(pl);
  // pot tanaman di teras
  for (const x of [0.0, 1.6]) {
    cyl(g, 0.13, 0.1, 0.24, 10, "#c8643a", x, Y0 + 0.12, 1.15);
    ball(g, 0.2, "#4f9d42", x, Y0 + 0.38, 1.15, 1, 1.15, 1, 1);
  }
  // pagar: tembok rendah berlapis plester, tiang, dan jeruji besi; celah gerbang di depan pintu
  for (const [x0, x1] of [[-1.98, 0.05], [1.0, 1.98]]) {
    const w = x1 - x0, cx = (x0 + x1) / 2;
    box(g, w, 0.4, 0.14, st.accent, cx, 0.2, 1.47);
    box(g, w, 0.04, 0.06, "#2a2a30", cx, 0.95, 1.47);
    for (let x = x0 + 0.06; x < x1; x += 0.12) box(g, 0.025, 0.55, 0.025, "#2a2a30", x, 0.68, 1.47);
  }
  for (const x of [-1.98, 0.05, 1.0, 1.98]) box(g, 0.18, 1.05, 0.18, st.wall, x, 0.52, 1.47);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

function placeActor(a, x, z, yaw, dt, moving) {
  const dist = a.x === null ? 0 : Math.hypot(x - a.x, z - a.z);
  a.x = x; a.z = z;
  const d = Math.atan2(Math.sin(yaw - a.yaw), Math.cos(yaw - a.yaw));
  a.yaw += d * Math.min(1, dt * 12);
  a.root.position.set(x, 0, z); a.root.rotation.y = a.yaw;
  a.update(dt, dist / CHAR_SCALE, moving);
  a.blob.position.set(x, 0.02, z);
}

// penanda tujuan tap
const markTex = (() => {                            // cincin emas lembut
  const cv = mk(128, 128), c = cv.getContext("2d");
  c.shadowColor = "rgba(255,200,90,0.9)"; c.shadowBlur = 10;
  c.strokeStyle = "#ffe48a"; c.lineWidth = 7;
  c.beginPath(); c.arc(64, 64, 44, 0, Math.PI * 2); c.stroke();
  return smoothTex(cv);
})();
const marker = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: markTex, transparent: true, depthWrite: false }));
marker.rotation.x = -Math.PI / 2;
scene.add(marker);

// Titik anomali: kubus kecil yang bergetar dan berkedip. Didekati berarti battle. Bos lebih besar dan kemerahan.
let emLangkah = 0;
const anomalies = [...BAB1.anomali, BAB1.bos].map((def) => {
  const a = { ...def, armed: true, group: new THREE.Group() };
  const warna = def.bos ? ["#ff5a7a", "#ffb04f", "#ffffff"] : ["#7ae8ff", "#ff4fb4", "#ffffff"];
  for (let i = 0; i < (def.bos ? 16 : 9); i++) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.16), new THREE.MeshBasicMaterial({ color: warna[i % 3], toneMapped: false }));
    m.userData.seed = i * 1.7;
    a.group.add(m);
  }
  a.light = new THREE.PointLight(def.bos ? "#ff6a5a" : "#9a7bff", 2.5, 3.5, 1.5);
  a.light.position.y = 0.7;
  a.group.add(a.light);
  a.group.position.set(a.tx + 0.5, 0, a.ty + 0.5);
  if (def.bos) a.group.scale.setScalar(1.7);
  scene.add(a.group);
  return a;
});

// ================================================================ post-processing HD-2D
// Scene dirender ke tekstur bermipmap. Mipmap dipakai sebagai blur murah untuk tilt-shift dan bloom.
let rt = null;
const post = new THREE.ShaderMaterial({
  uniforms: { tScene: { value: null }, uFocus: { value: 0.5 }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(1, 1) } },
  vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: `
    uniform sampler2D tScene; uniform float uFocus, uTime; uniform vec2 uRes; varying vec2 vUv;
    vec3 blurAt(vec2 uv, float lod){
      vec2 o = exp2(lod) / uRes * 0.75;
      return (textureLod(tScene, uv + vec2(o.x, o.y), lod).rgb + textureLod(tScene, uv + vec2(-o.x, o.y), lod).rgb
            + textureLod(tScene, uv + vec2(o.x, -o.y), lod).rgb + textureLod(tScene, uv - o, lod).rgb) * 0.25;
    }
    vec3 aces(vec3 x){ return clamp(x * (2.51 * x + 0.03) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    vec3 toSRGB(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
    void main(){
      vec2 uv = vUv;
      vec3 sharp = textureLod(tScene, uv, 0.0).rgb;
      float d = abs(uv.y - uFocus) - (uv.y > uFocus ? 0.18 : 0.20);
      float amt = smoothstep(0.0, 0.35, d);
      vec3 col = mix(sharp, blurAt(uv, amt * 2.2), smoothstep(0.0, 0.3, amt));
      vec3 b = textureLod(tScene, uv, 3.0).rgb * 0.45 + blurAt(uv, 4.5) * 0.35 + blurAt(uv, 6.0) * 0.3;
      col += max(b - vec3(0.5), 0.0) * vec3(1.7, 1.25, 0.9);
      float ray = pow(max(0.0, sin((uv.x * 1.2 - uv.y * 0.8) * 10.0 + uTime * 0.12)), 10.0);
      col += ray * smoothstep(0.55, 1.0, uv.y) * smoothstep(0.0, 0.5, uv.x) * vec3(0.05, 0.032, 0.018);
      col = aces(col * 1.25);
      col = toSRGB(col);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 1.12);
      col += vec3(0.035, 0.0, 0.06) * (1.0 - col);
      vec2 q = (uv - 0.5) * vec2(1.25, 0.95);
      col *= 1.0 - dot(q, q) * 0.85;
      col += (fract(sin(dot(uv * uRes + fract(uTime) * 91.0, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) * 0.025;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ================================================================ ukuran layar
// Area main selalu 9:16. Lapisan UI pixel art 180 x 320 di atasnya.
const view = { w: 360, h: 640, left: 0, top: 0 };
function fit() {
  const w = Math.floor(Math.min(innerWidth, innerHeight * 9 / 16)), h = Math.floor(w * 16 / 9);
  Object.assign(view, { w, h });
  const wrap = document.getElementById("wrap");
  wrap.style.width = w + "px"; wrap.style.height = h + "px";
  wrap.style.setProperty("--w", w + "px");          // ukuran huruf dialog mengikuti lebar layar main
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const pr = renderer.getPixelRatio();
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(Math.floor(w * pr), Math.floor(h * pr),
    { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true });
  post.uniforms.uRes.value.set(w * pr, h * pr);
  flyMat.uniforms.uPx.value = pr * Math.max(1, w / 180);   // satu piksel game
}
addEventListener("resize", fit);
fit();

// model karakter dimuat setelah ukuran layar siap, sebelum input dan putaran permainan berjalan
const [playerActor, kaelActor, ...npcActors] = await Promise.all(["nino", "kael", ...NPCS.map((n) => n.char)].map(makeActor));
await worldReady;
document.getElementById("loading").remove();
NPCS.forEach((n, i) => { n.actor = npcActors[i]; });
hud = createHud(document.getElementById("wrap"), save, { tujuan, adaKael, onChange: () => simpan(save), onOpen: (o) => { menuOpen = o; player.path = []; target.x = -1; pending = null; } });

// Kael mengikuti Nino: berjalan di jejak langkah Nino, sekitar satu tile di belakang.
const kael = { x: player.x, y: player.y + TS, yaw: 0 };
function kaelGabung() { const r = NPCS.find((n) => n.id === "rin"); kael.x = r.tx * TS; kael.y = (r.ty + 1) * TS; trail.length = 0; }
function placeKael(dt) {
  kaelActor.root.visible = kaelActor.blob.visible = adaKael();
  if (!adaKael()) return;
  let sisa = TS * 0.95, tx = kael.x, ty = kael.y, px = player.x, py = player.y;
  for (let i = trail.length - 1; i >= 0 && sisa > 0; i--) {      // mundur di jejak sejauh jarak ikut
    const [x, y] = trail[i], d = Math.hypot(px - x, py - y);
    if (d >= sisa) { tx = px + (x - px) * sisa / d; ty = py + (y - py) * sisa / d; sisa = 0; break; }
    sisa -= d; px = x; py = y; tx = x; ty = y;
  }
  if (sisa > 0 && trail.length === 0) { tx = kael.x; ty = kael.y; }
  const dx = tx - kael.x, dy = ty - kael.y, d = Math.hypot(dx, dy), langkah = Math.min(d, SPEED * 1.15 * dt);
  const jalan = d > 0.5;
  if (jalan) { kael.x += dx / d * langkah; kael.y += dy / d * langkah; kael.yaw = Math.atan2(dx, dy); }
  placeActor(kaelActor, kael.x / TS + 0.5, kael.y / TS + 0.5, kael.yaw, dt, jalan);
}
if (cerita.langkah === 0) openScript(BAB1.pembuka, () => majuCerita(1));

function placeCamera() {
  camera.position.set(cam.x, DIST * Math.sin(PITCH), cam.z + DIST * Math.cos(PITCH));
  camera.lookAt(cam.x, 0, cam.z);
  camera.updateMatrixWorld();
  sun.position.set(cam.x - 14, 16, cam.z + 7);
  sun.target.position.set(cam.x, 0, cam.z - 2);
}

// ================================================================ render
function render(now, dt) {
  const t = now / 1000;
  placeCamera();
  placeActor(playerActor, player.x / TS + 0.5, player.y / TS + 0.5, player.yaw, dt, player.walk > 0);
  for (const n of NPCS) placeActor(n.actor, n.tx + 0.5, n.ty + 0.5, DIR_YAW[n.dir], dt, false);
  marker.visible = target.x >= 0;
  if (marker.visible) { marker.position.set(target.x + 0.5, 0.03, target.y + 0.5); marker.material.opacity = 0.55 + 0.45 * Math.sin(t * 8); }
  for (const a of anomalies) {
    a.group.visible = anomaliAktif(a);
    if (!a.group.visible) continue;
    a.group.children.forEach((m) => {
      if (!m.isMesh) return;
      const k = m.userData.seed, j = Math.floor(t * 12 + k) % 5 === 0;
      m.position.set(Math.sin(t * 2 + k) * 0.28 + (j ? 0.08 : 0), 0.45 + Math.sin(t * 3.1 + k * 2) * 0.25, Math.cos(t * 2 + k) * 0.28);
      m.rotation.set(t * 2 + k, t * 3, 0);
      m.visible = Math.floor(t * 9 + k * 3) % 7 !== 0;
    });
    a.light.intensity = 2 + Math.sin(t * 20) * 0.8;
  }
  placeKael(dt);
  waterMat.uniforms.uTime.value = t; flyMat.uniforms.uTime.value = t;
  halos.forEach((hl, i) => { const s = 1.6 + Math.sin(t * 3 + i) * 0.08; hl.scale.set(s, s, 1); });
  const fp = new THREE.Vector3(player.x / TS + 0.5, 0.6, player.y / TS + 0.5).project(camera);
  post.uniforms.uFocus.value = fp.y * 0.5 + 0.5;
  post.uniforms.uTime.value = t;
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  post.uniforms.tScene.value = rt.texture;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
  dlgEl.style.display = dlg.npc ? "block" : "none";
  if (dlg.npc) drawDialog(now);
}

// kotak dialog di DOM: teks diketik bertahap, panah berkedip saat baris selesai
const dlgEl = document.getElementById("dlg"), dlgName = document.getElementById("dlgName");
const dlgText = document.getElementById("dlgText"), dlgNext = document.getElementById("dlgNext");
function drawDialog(now) {
  const { n, t: text } = dlgLine();
  dlgName.textContent = n; dlgName.style.display = n ? "" : "none";
  dlgText.textContent = text.slice(0, Math.floor(dlg.shown));
  dlgNext.style.visibility = dlg.shown >= text.length && Math.floor(now / 400) % 2 === 0 ? "visible" : "hidden";
}

// ================================================================ input
// Tap: sinar dari kamera. Kena NPC berarti ajak bicara, selain itu tile di tanah jadi tujuan.
const ray = new THREE.Raycaster();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
glCanvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (battle || menuOpen) return;
  if (dlg.npc) { advanceDialog(); return; }
  const r = glCanvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  placeCamera();
  ray.setFromCamera(ndc, camera);
  const hitNpc = ray.intersectObjects(NPCS.map((n) => n.actor.hit))[0];
  let tx, ty;
  if (hitNpc) { const n = NPCS.find((q) => q.actor.hit === hitNpc.object); tx = n.tx; ty = n.ty; }
  else {
    const p = ray.ray.intersectPlane(groundPlane, new THREE.Vector3());
    if (!p) return;
    tx = Math.floor(p.x); ty = Math.floor(p.z);
  }
  const npc = npcAt(tx, ty);
  if (npc) {
    if (adjacent(npc)) { player.path = []; openDialog(npc); return; }
    const spots = [[1, 0], [-1, 0], [0, 1], [0, -1]]
      .map(([dx, dy]) => findPath(player.tx, player.ty, tx + dx, ty + dy))
      .filter(Boolean)
      .sort((a, b) => pathLen(a) - pathLen(b));
    if (!spots.length) return;
    player.path = spots[0]; pending = npc;
    const end = spots[0][spots[0].length - 1];
    target.x = end[0] / TS; target.y = end[1] / TS;
    return;
  }
  const path = findPath(player.tx, player.ty, tx, ty);
  if (!path) return;
  pending = null;
  player.path = path;
  target.x = tx; target.y = ty;
});
glCanvas.addEventListener("contextmenu", (e) => e.preventDefault());

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (battle) { requestAnimationFrame(frame); return; }   // dunia diam selama battle, gambar terakhir jadi latar
  update(dt);
  updateCamera();
  render(now, dt);
  requestAnimationFrame(frame);
}
updateCamera();
requestAnimationFrame(frame);

// Dipakai untuk uji otomatis: posisi layar (piksel CSS) dari tengah tile di tanah
function tileToScreen(tx, ty) {
  placeCamera();
  const p = new THREE.Vector3(tx + 0.5, 0, ty + 0.5).project(camera);
  const r = glCanvas.getBoundingClientRect();
  return { x: r.left + (p.x * 0.5 + 0.5) * r.width, y: r.top + (-p.y * 0.5 + 0.5) * r.height, left: r.left, top: r.top, w: r.width, h: r.height };
}
window.__recursio = { TS, MW, MH, map, player, cam, target, dlg, NPCS, CAM_BOUNDS, tileToScreen, playerActor, anomalies, save, kael, get battle() { return battle; } };
</script>
